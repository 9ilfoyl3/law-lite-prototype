<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史任务 - AI辅助办案系统</title>
    <link href="../libs/font-awesome-all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <style>
        .tasks-page {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .tasks-search-box {
            position: relative;
            width: 320px;
        }

        .tasks-search-box input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            background: var(--bg-primary);
        }

        .tasks-search-box input:focus {
            border-color: var(--accent-primary);
        }

        .tasks-search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 13px;
            pointer-events: none;
        }

        .tasks-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tasks-tabs::-webkit-scrollbar {
            display: none;
        }

        .tasks-tab {
            padding: 10px 4px;
            margin-right: 24px;
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
            white-space: nowrap;
            border: none;
            background: transparent;
            font-family: inherit;
        }

        .tasks-tab:hover {
            color: var(--text-primary);
        }

        .tasks-tab.active {
            color: var(--accent-primary);
            font-weight: 500;
        }

        .tasks-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-primary);
            border-radius: 1px;
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
        }

        .task-card {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px 20px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.15s;
            background: var(--bg-secondary);
        }

        .task-card:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.08);
        }

        .task-card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 16px;
        }

        .task-card-icon.type-verdict {
            background: #eff6ff;
            color: #3b82f6;
        }

        .task-card-icon.type-trial {
            background: #f0fdf4;
            color: #22c55e;
        }

        .task-card-icon.type-law {
            background: #fefce8;
            color: #eab308;
        }

        .task-card-icon.type-qa {
            background: #faf5ff;
            color: #a855f7;
        }

        .task-card-body {
            flex: 1;
            min-width: 0;
        }

        .task-card-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .task-card-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .task-card-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            padding-top: 4px;
        }

        .task-card-time {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .task-card-delete {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 13px;
            opacity: 0;
        }

        .task-card:hover .task-card-delete {
            opacity: 1;
        }

        .task-card-delete:hover {
            background: #fef2f2;
            color: #ef4444;
        }

        .tasks-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 24px;
            color: var(--text-muted);
        }

        .tasks-empty i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.25;
        }

        .tasks-empty span {
            font-size: 15px;
        }

        @media (max-width: 768px) {
            .tasks-page {
                padding: 16px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .tasks-search-box {
                width: 100%;
            }

            .task-card-right {
                flex-direction: column;
                align-items: flex-end;
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-logo">
            <i class="fas fa-cube"></i>
        </div>
        <div class="nav-items">
            <a href="chat.html" class="nav-item">
                <i class="fas fa-comments"></i>
                <span>聊天</span>
            </a>
            <a href="tasks.html" class="nav-item active">
                <i class="fas fa-list-check"></i>
                <span>全部</span>
            </a>
            <a href="cases.html" class="nav-item">
                <i class="fas fa-folder"></i>
                <span>案件</span>
            </a>
            <a href="knowledge.html" class="nav-item">
                <i class="fas fa-book"></i>
                <span>知识库</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span style="font-size: 16px; font-weight: 500; color: var(--text-primary);">历史任务</span>
            </div>
            <div class="user-menu" id="userMenu" style="position: relative;">
                <div class="user-avatar" onclick="toggleUserDropdown()" style="cursor: pointer;">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-dropdown" id="userDropdown">
                    <button class="user-dropdown-item logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>退出登录</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Tasks Page Content -->
        <div class="tasks-page">
            <div class="page-header">
                <h1 class="page-title">历史任务</h1>
                <div class="tasks-search-box">
                    <i class="fas fa-search tasks-search-icon"></i>
                    <input type="text" placeholder="搜索任务名称" id="tasksSearchInput">
                </div>
            </div>

            <div class="tasks-tabs" id="tasksTabs"></div>

            <div class="tasks-list" id="tasksList"></div>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script>
        var allTasksData = [
            {
                type: 'verdict',
                name: '裁判文书',
                icon: 'fa-file-signature',
                iconClass: 'type-verdict',
                tasks: [
                    { id: 't1', title: '民间借贷纠纷判决书', subtitle: '根据原告张某与被告李某民间借贷纠纷一案，经审理查明……', time: '2026/5/14 10:32' },
                    { id: 't2', title: '买卖合同纠纷判决书', subtitle: '原告某公司与被告某厂买卖合同纠纷一案……', time: '2026/5/13 14:20' },
                    { id: 't3', title: '房屋租赁合同纠纷判决书', subtitle: '原告王某与被告赵某房屋租赁合同纠纷……', time: '2026/5/12 09:15' }
                ]
            },
            {
                type: 'trial',
                name: '庭审提纲',
                icon: 'fa-gavel',
                iconClass: 'type-trial',
                tasks: [
                    { id: 't4', title: '民间借贷纠纷庭审提纲', subtitle: '本案争议焦点为借款事实是否成立及利息计算标准……', time: '2026/5/14 09:00' },
                    { id: 't5', title: '劳动争议庭审提纲', subtitle: '涉及违法解除劳动合同赔偿金及加班费争议……', time: '2026/5/11 16:45' }
                ]
            },
            {
                type: 'law',
                name: '法条适用',
                icon: 'fa-balance-scale',
                iconClass: 'type-law',
                tasks: [
                    { id: 't6', title: '民间借贷法条检索', subtitle: '检索《民法典》第六百七十九条至六百八十七条相关条款……', time: '2026/5/14 11:05' },
                    { id: 't7', title: '合同违约责任法条检索', subtitle: '检索《民法典》第五百七十七条至五百八十五条违约责任条款……', time: '2026/5/10 13:30' }
                ]
            },
            {
                type: 'qa',
                name: '知识问答',
                icon: 'fa-lightbulb',
                iconClass: 'type-qa',
                tasks: [
                    { id: 't8', title: '诉讼时效相关问题咨询', subtitle: '民事诉讼时效三年规定的起算时间及中断情形……', time: '2026/5/13 15:22' },
                    { id: 't9', title: '管辖权异议程序咨询', subtitle: '管辖权异议的提出期限、审查程序及裁定救济途径……', time: '2026/5/9 10:10' }
                ]
            }
        ];

        var currentTab = 'all';

        function renderTabs() {
            var tabsEl = document.getElementById('tasksTabs');
            var html = '<button class="tasks-tab' + (currentTab === 'all' ? ' active' : '') + '" onclick="switchTab(\'all\')">全部</button>';
            allTasksData.forEach(function(group) {
                html += '<button class="tasks-tab' + (currentTab === group.type ? ' active' : '') + '" onclick="switchTab(\'' + group.type + '\')">' + group.name + '</button>';
            });
            tabsEl.innerHTML = html;
        }

        function switchTab(type) {
            currentTab = type;
            renderTabs();
            renderList(document.getElementById('tasksSearchInput').value);
        }

        function renderList(query) {
            query = query || '';
            var list = document.getElementById('tasksList');
            var lowerQuery = query.toLowerCase();

            var filteredGroups;
            if (currentTab === 'all') {
                filteredGroups = allTasksData.map(function(g) {
                    return {
                        type: g.type,
                        name: g.name,
                        icon: g.icon,
                        iconClass: g.iconClass,
                        tasks: g.tasks.filter(function(t) {
                            return !query || t.title.toLowerCase().indexOf(lowerQuery) !== -1;
                        })
                    };
                });
            } else {
                var group = allTasksData.filter(function(g) { return g.type === currentTab; })[0];
                if (!group) return;
                filteredGroups = [{
                    type: group.type,
                    name: group.name,
                    icon: group.icon,
                    iconClass: group.iconClass,
                    tasks: group.tasks.filter(function(t) {
                        return !query || t.title.toLowerCase().indexOf(lowerQuery) !== -1;
                    })
                }];
            }

            var html = '';
            var hasAny = false;

            filteredGroups.forEach(function(group) {
                group.tasks.forEach(function(task) {
                    hasAny = true;
                    html += '<div class="task-card" onclick="openTask(\'' + task.id + '\')">';
                    html += '    <div class="task-card-icon ' + group.iconClass + '"><i class="fas ' + group.icon + '"></i></div>';
                    html += '    <div class="task-card-body">';
                    html += '        <div class="task-card-title">' + task.title + '</div>';
                    html += '        <div class="task-card-subtitle">' + task.subtitle + '</div>';
                    html += '    </div>';
                    html += '    <div class="task-card-right">';
                    html += '        <span class="task-card-time">' + task.time + '</span>';
                    html += '        <button class="task-card-delete" onclick="deleteTask(event, \'' + task.id + '\')" title="删除">';
                    html += '            <i class="fas fa-trash-alt"></i>';
                    html += '        </button>';
                    html += '    </div>';
                    html += '</div>';
                });
            });

            if (!hasAny) {
                html = '<div class="tasks-empty"><i class="fas fa-clipboard-list"></i><span>暂无任务记录</span></div>';
            }

            list.innerHTML = html;
        }

        function openTask(taskId) {
            window.location.href = 'chat.html?task=' + taskId;
        }

        function deleteTask(event, taskId) {
            event.stopPropagation();
            if (!confirm('确定要删除这个任务吗？')) return;

            allTasksData.forEach(function(group) {
                var idx = group.tasks.findIndex(function(t) { return t.id === taskId; });
                if (idx !== -1) {
                    group.tasks.splice(idx, 1);
                }
            });
            renderList(document.getElementById('tasksSearchInput').value);
        }

        document.getElementById('tasksSearchInput').addEventListener('input', function() {
            renderList(this.value);
        });

        function toggleUserDropdown() {
            document.getElementById('userDropdown').classList.toggle('show');
        }

        function logout() {
            window.location.href = 'login.html';
        }

        document.addEventListener('click', function(e) {
            var userMenu = document.getElementById('userMenu');
            if (userMenu && !userMenu.contains(e.target)) {
                document.getElementById('userDropdown').classList.remove('show');
            }
        });

        renderTabs();
        renderList();
    </script>
</body>
</html>
