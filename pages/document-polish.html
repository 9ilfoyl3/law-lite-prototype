<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>文书精修 - AI辅助办案系统</title>
    <link href="../libs/font-awesome-all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* ===== Header ===== */
        .polish-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .polish-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .polish-back-btn {
            width: 34px; height: 34px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-secondary);
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 14px;
            transition: all 0.2s;
        }
        .polish-back-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        .polish-title-block { display: flex; flex-direction: column; }
        .polish-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .polish-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .polish-header-right { display: flex; gap: 8px; }
        .polish-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .polish-action-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        .polish-action-btn.primary {
            background: var(--accent-primary);
            color: #fff;
            border-color: var(--accent-primary);
        }
        .polish-action-btn.primary:hover { background: #1d4ed8; }
        .polish-action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ===== Body: Two Columns ===== */
        .polish-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .polish-doc-col {
            flex: 3;
            display: flex;
            flex-direction: column;
            border-right: none;
            background: var(--bg-primary);
            overflow: hidden;
            min-width: 320px;
        }
        /* 可拖动分隔条（文书 75% / 精修对话 25% 默认比例，用户可拖动调整） */
        .polish-resizer {
            flex: 0 0 6px;
            cursor: col-resize;
            background: var(--border-color);
            position: relative;
            transition: background 0.15s;
        }
        .polish-resizer:hover,
        .polish-resizer.dragging {
            background: var(--accent-primary);
        }
        .polish-resizer::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 28px;
            background: #fff;
            border-radius: 1px;
            opacity: 0.8;
        }
        .polish-doc-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .polish-doc-toolbar .toolbar-left { display: flex; align-items: center; gap: 8px; }
        .polish-doc-toolbar .toolbar-tag {
            padding: 2px 8px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        .polish-doc-content {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            background: #f0f0f0;
        }
        .polish-doc-paper {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 50px 60px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border-radius: 4px;
            min-height: 600px;
            font-family: "Noto Serif SC", "SimSun", serif;
            line-height: 2;
            color: #333;
        }
        .polish-doc-paper p { margin: 1em 0; text-indent: 2em; }
        .polish-doc-paper h2 { text-align: center; font-size: 20pt; font-weight: bold; margin-bottom: 24px; }
        .polish-doc-paper h3 { font-size: 13pt; font-weight: bold; margin: 20px 0 12px; }
        .polish-doc-paper { outline: 2px dashed var(--accent-primary); }

        /* ===== Doc Editor (共用组件) ===== */
        .doc-editor-root {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-secondary);
        }
        .doc-editor-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            overflow-x: auto;
        }
        .doc-editor-toolbar-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .doc-editor-toolbar-sep {
            width: 1px;
            height: 18px;
            background: var(--border-color);
            margin: 0 4px;
            flex-shrink: 0;
        }
        .doc-editor-toolbar-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 30px;
            height: 28px;
            padding: 0;
            border: 1px solid transparent;
            border-radius: 5px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .doc-editor-toolbar-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--border-color);
            color: var(--text-primary);
        }
        .doc-editor-toolbar-btn.active {
            background: var(--accent-light);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        .doc-editor-toolbar-btn .btn-label {
            font-size: 11px;
            font-weight: 500;
        }
        .doc-editor-shell {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
            background: #f0f0f0;
        }
        .doc-editor-paper {
            max-width: 800px;
            min-height: 600px;
            margin: 0 auto;
            padding: 50px 60px;
            background: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border-radius: 4px;
            font-family: "Noto Serif SC", "SimSun", serif;
            font-size: 14px;
            line-height: 2;
            color: #333;
            outline: none;
        }
        .doc-editor-paper:focus {
            box-shadow: 0 0 0 2px rgba(37,99,235,0.08), 0 2px 12px rgba(0,0,0,0.08);
        }
        .doc-editor-paper p { margin: 1em 0; text-indent: 2em; }
        .doc-editor-paper h2 { text-align: center; font-size: 20pt; font-weight: bold; margin: 0 0 24px; }
        .doc-editor-paper h3 { font-size: 13pt; font-weight: bold; margin: 20px 0 12px; }
        .doc-editor-paper ul, .doc-editor-paper ol { margin: 1em 0; padding-left: 2em; }
        .doc-editor-paper li { margin: 0.3em 0; }

        /* ===== Chat Column ===== */
        .polish-chat-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            overflow: hidden;
            min-width: 240px;
        }
        .polish-chat-header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .polish-chat-header i { color: var(--accent-primary); }
        .polish-chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .polish-msg {
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
        }
        .polish-msg-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .polish-msg.user .polish-msg-avatar { background: var(--accent-primary); color: #fff; }
        .polish-msg.assistant .polish-msg-avatar { background: #f3f4f6; color: var(--text-secondary); }
        .polish-msg-bubble {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            max-width: 300px;
        }
        .polish-msg.user .polish-msg-bubble { background: var(--accent-primary); color: #fff; }
        .polish-msg.assistant .polish-msg-bubble { background: #f3f4f6; color: var(--text-primary); }
        .polish-chat-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 13px;
        }
        .polish-chat-empty i { font-size: 32px; opacity: 0.3; margin-bottom: 8px; display: block; }
        .polish-chat-input-area {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .polish-chat-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
            resize: none;
            min-height: 40px;
            max-height: 120px;
        }
        .polish-chat-input:focus { border-color: var(--accent-primary); }
        .polish-send-btn {
            padding: 0 16px;
            border: none;
            border-radius: 8px;
            background: var(--accent-primary);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }
        .polish-send-btn:hover { background: #1d4ed8; }
        .polish-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ===== Context Panel ===== */
        .polish-context {
            padding: 12px 20px;
            background: #f9fafb;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .polish-context-row { display: flex; flex-direction: column; gap: 8px; }
        .polish-context-item { display: flex; align-items: flex-start; gap: 6px; line-height: 1.5; }
        .polish-context-item i { color: var(--text-muted); font-size: 12px; margin-top: 2px; flex-shrink: 0; }
        .polish-context-label { color: var(--text-muted); flex-shrink: 0; }
        .polish-context-value { color: var(--text-secondary); word-break: break-all; }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="polish-header">
        <div class="polish-header-left">
            <button class="polish-back-btn" onclick="goBackToCase()" title="返回案件">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="polish-title-block">
                <div class="polish-title" id="polishDocTitle">文书精修</div>
                <div class="polish-subtitle" id="polishCaseName">-</div>
            </div>
        </div>
        <div class="polish-header-right">
            <button class="polish-action-btn" onclick="undoLastEdit()" title="撤销上一步精修" id="undoBtn" disabled>
                <i class="fas fa-undo"></i> 撤销
            </button>
            <button class="polish-action-btn primary" onclick="saveAsNewVersion()" id="saveBtn">
                <i class="fas fa-save"></i> 保存为新版本
            </button>
        </div>
    </div>

    <!-- Body -->
    <div class="polish-body">
        <!-- Left: Document Content -->
        <div class="polish-doc-col">
            <div class="polish-doc-toolbar">
                <div class="toolbar-left">
                    <i class="fas fa-file-alt"></i>
                    <span>文书正文</span>
                    <span class="toolbar-tag" id="versionTag">原版本</span>
                </div>
                <div class="toolbar-right">
                    <span id="editHint" style="color:var(--text-muted);">精修指令将在此区域生效</span>
                </div>
            </div>
            <div class="polish-doc-content" id="docEditorRoot">
                <!-- 文档编辑器由 document-polish.js 初始化 -->
            </div>
        </div>

        <!-- Resizer（可拖动分隔条） -->
        <div class="polish-resizer" id="polishResizer" title="拖动调整宽度"></div>

        <!-- Right: Chat -->
        <div class="polish-chat-col">
            <div class="polish-chat-header">
                <i class="fas fa-comments"></i>
                <span>精修对话</span>
            </div>
            <div class="polish-context" id="polishContext">
                <div class="polish-context-row" id="contextRow"></div>
            </div>
            <div class="polish-chat-messages" id="chatMessages">
                <div class="polish-chat-empty">
                    <i class="fas fa-comment-dots"></i>
                    <div>输入精修指令开始优化文书</div>
                    <div style="margin-top:6px;font-size:12px;">例如：精简事实认定部分、补充法条引用、调整语气</div>
                </div>
            </div>
            <div class="polish-chat-input-area">
                <textarea class="polish-chat-input" id="chatInput" placeholder="输入精修指令..." rows="1" onkeydown="handleChatKeydown(event)"></textarea>
                <button class="polish-send-btn" id="sendBtn" onclick="sendPolishMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="../js/common.js?v=30"></script>
    <script src="../js/case-data.js?v=60"></script>
    <script src="../js/doc-editor.js?v=1"></script>
    <script src="../js/document-polish.js?v=5"></script>
</body>
</html>
