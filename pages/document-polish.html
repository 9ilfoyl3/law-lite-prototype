<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>文书精修 - 智能办案系统</title>
    <link href="../libs/font-awesome-all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* ===== Header ===== */
        .polish-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .polish-header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .polish-back-btn {
            width: 34px; height: 34px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-secondary);
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 14px;
            transition: all 0.2s;
        }
        .polish-back-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        .polish-title-block { display: flex; flex-direction: column; }
        .polish-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .polish-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .polish-header-right { display: flex; gap: 8px; }
        .polish-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .polish-action-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        .polish-action-btn.primary {
            background: var(--accent-primary);
            color: #fff;
            border-color: var(--accent-primary);
        }
        .polish-action-btn.primary:hover { background: #1d4ed8; }
        .polish-action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ===== Body: Two Columns ===== */
        .polish-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .polish-doc-col {
            flex: 3;
            display: flex;
            flex-direction: column;
            border-right: none;
            background: var(--bg-primary);
            overflow: hidden;
            min-width: 320px;
        }
        /* 可拖动分隔条（文书 75% / 精修对话 25% 默认比例，用户可拖动调整） */
        .polish-resizer {
            flex: 0 0 6px;
            cursor: col-resize;
            background: var(--border-color);
            position: relative;
            transition: background 0.15s;
        }
        .polish-resizer:hover,
        .polish-resizer.dragging {
            background: var(--accent-primary);
        }
        .polish-resizer::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 28px;
            background: #fff;
            border-radius: 1px;
            opacity: 0.8;
        }
        .polish-doc-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .polish-doc-toolbar .toolbar-left { display: flex; align-items: center; gap: 8px; }
        .polish-doc-toolbar .toolbar-tag {
            padding: 2px 8px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
        }
        .polish-doc-content {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            background: #f0f0f0;
        }
        .polish-doc-paper {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 50px 60px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            border-radius: 4px;
            min-height: 600px;
            font-family: "Noto Serif SC", "SimSun", serif;
            line-height: 2;
            color: #333;
        }
        .polish-doc-paper p { margin: 1em 0; text-indent: 2em; }
        .polish-doc-paper h2 { text-align: center; font-size: 20pt; font-weight: bold; margin-bottom: 24px; }
        .polish-doc-paper h3 { font-size: 13pt; font-weight: bold; margin: 20px 0 12px; }
        .polish-doc-paper { outline: 2px dashed var(--accent-primary); }

        /* ===== Doc Editor (共用组件) ===== */
        .doc-editor-root {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-secondary);
        }
        .doc-editor-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            overflow-x: auto;
        }
        .doc-editor-toolbar-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .doc-editor-toolbar-sep {
            width: 1px;
            height: 18px;
            background: var(--border-color);
            margin: 0 4px;
            flex-shrink: 0;
        }
        .doc-editor-toolbar-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 30px;
            height: 28px;
            padding: 0;
            border: 1px solid transparent;
            border-radius: 5px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .doc-editor-toolbar-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--border-color);
            color: var(--text-primary);
        }
        .doc-editor-toolbar-btn.active {
            background: var(--accent-light);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        .doc-editor-toolbar-btn .btn-label {
            font-size: 11px;
            font-weight: 500;
        }
        .doc-editor-shell {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
            background: #f0f0f0;
        }
        .doc-editor-paper {
            max-width: 800px;
            min-height: 600px;
            margin: 0 auto;
            padding: 50px 60px;
            background: #fff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border-radius: 4px;
            font-family: "Noto Serif SC", "SimSun", serif;
            font-size: 14px;
            line-height: 2;
            color: #333;
            outline: none;
        }
        .doc-editor-paper:focus {
            box-shadow: 0 0 0 2px rgba(37,99,235,0.08), 0 2px 12px rgba(0,0,0,0.08);
        }
        .doc-editor-paper p { margin: 1em 0; text-indent: 2em; }
        .doc-editor-paper h2 { text-align: center; font-size: 20pt; font-weight: bold; margin: 0 0 24px; }
        .doc-editor-paper h3 { font-size: 13pt; font-weight: bold; margin: 20px 0 12px; }
        .doc-editor-paper ul, .doc-editor-paper ol { margin: 1em 0; padding-left: 2em; }
        .doc-editor-paper li { margin: 0.3em 0; }

        /* ===== Chat Column ===== */
        .polish-chat-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            overflow: hidden;
            min-width: 240px;
        }
        .polish-chat-header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .polish-chat-header i { color: var(--accent-primary); }
        .polish-chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .polish-msg {
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
        }
        .polish-msg-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .polish-msg.user .polish-msg-avatar { background: var(--accent-primary); color: #fff; }
        .polish-msg.assistant .polish-msg-avatar { background: #f3f4f6; color: var(--text-secondary); }
        .polish-msg-bubble {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            max-width: 300px;
        }
        .polish-msg.user .polish-msg-bubble { background: var(--accent-primary); color: #fff; }
        .polish-msg.assistant .polish-msg-bubble { background: #f3f4f6; color: var(--text-primary); }
        .polish-chat-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 13px;
        }
        .polish-chat-empty i { font-size: 32px; opacity: 0.3; margin-bottom: 8px; display: block; }
        .polish-chat-input-area {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .polish-chat-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            background: var(--bg-primary);
            color: var(--text-primary);
            outline: none;
            resize: none;
            min-height: 40px;
            max-height: 120px;
        }
        .polish-chat-input:focus { border-color: var(--accent-primary); }
        .polish-send-btn {
            padding: 0 16px;
            border: none;
            border-radius: 8px;
            background: var(--accent-primary);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }
        .polish-send-btn:hover { background: #1d4ed8; }
        .polish-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ===== Context Panel ===== */
        .polish-context {
            padding: 12px 20px;
            background: #f9fafb;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .polish-context-row { display: flex; flex-direction: column; gap: 8px; }
        .polish-context-item { display: flex; align-items: flex-start; gap: 6px; line-height: 1.5; }
        .polish-context-item i { color: var(--text-muted); font-size: 12px; margin-top: 2px; flex-shrink: 0; }
        .polish-context-label { color: var(--text-muted); flex-shrink: 0; }
        .polish-context-value { color: var(--text-secondary); word-break: break-all; }



        /* ===== AI 改写浮动工具条（v1.52 示例图风格） ===== */
        .ai-rewrite-toolbar {
            position: absolute;
            z-index: 100;
            display: none;
            align-items: center;
            gap: 4px;
            padding: 4px 6px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.10);
        }
        .ai-rewrite-toolbar.visible { display: flex; }
        .ai-rewrite-toolbar-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-primary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
        }
        .ai-rewrite-toolbar-btn:hover { background: var(--bg-secondary); }
        .ai-rewrite-toolbar-btn i { color: var(--accent-primary); font-size: 11px; }

        /* ===== AI 改写卡片弹窗（v1.52 示例图风格） ===== */
        .ai-rewrite-card {
            position: absolute;
            z-index: 101;
            display: none;
            width: 380px;
            max-width: calc(100vw - 40px);
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.14);
            overflow: hidden;
        }
        .ai-rewrite-card.visible { display: block; }
        /* 输入态：隐藏标题栏和内容区，仅显示底部输入横条 */
        .ai-rewrite-card.input-mode .ai-rewrite-card-header { display: none; }
        .ai-rewrite-card.input-mode .ai-rewrite-card-body { display: none; }
        .ai-rewrite-card.input-mode .ai-rewrite-footer-compact { border-top: none; }
        .ai-rewrite-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
        }
        .ai-rewrite-card-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .ai-rewrite-card-title i { color: #7c3aed; font-size: 13px; }
        .ai-rewrite-card-title span { max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ai-rewrite-card-close {
            width: 24px; height: 24px;
            border: none;
            border-radius: 5px;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
        }
        .ai-rewrite-card-close:hover { background: var(--bg-secondary); color: var(--text-primary); }
        .ai-rewrite-card-body {
            padding: 14px;
            max-height: 280px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-primary);
        }
        .ai-rewrite-result-text {
            color: var(--text-primary);
            line-height: 1.7;
        }
        .ai-rewrite-result-hint {
            margin-top: 12px;
            font-size: 11px;
            color: var(--text-muted);
        }
        .ai-rewrite-footer-compact {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-top: 1px solid var(--border-color);
            background: #fff;
        }
        .ai-rewrite-footer-compact i { color: #7c3aed; font-size: 13px; }
        .ai-rewrite-footer-compact input {
            flex: 1;
            padding: 7px 0;
            border: none;
            background: transparent;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            color: var(--text-primary);
        }
        .ai-rewrite-footer-compact input::placeholder { color: var(--text-muted); }
        .ai-rewrite-footer-compact .ai-rewrite-send {
            width: 28px; height: 28px;
            border: none;
            border-radius: 50%;
            background: var(--accent-primary);
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            flex-shrink: 0;
        }
        .ai-rewrite-footer-compact .ai-rewrite-send:hover { background: #1d4ed8; }
        .ai-rewrite-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 10px 14px;
            border-top: 1px solid var(--border-color);
            background: #fff;
        }
        .ai-rewrite-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .ai-rewrite-action-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        .ai-rewrite-action-btn.primary {
            background: var(--accent-primary);
            color: #fff;
            border-color: var(--accent-primary);
        }
        .ai-rewrite-action-btn.primary:hover { background: #1d4ed8; }
        .ai-rewrite-action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .ai-rewrite-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 24px;
            color: var(--text-muted);
            font-size: 13px;
        }
        .ai-rewrite-loading::after {
            content: '';
            width: 14px; height: 14px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: aiRewriteSpin 0.8s linear infinite;
        }
        @keyframes aiRewriteSpin { to { transform: rotate(360deg); } }

        /* ===== 上下文卡片（三卡片） ===== */
        .polish-context-cards { display: flex; flex-direction: column; gap: 6px; }
        .polish-context-card {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 12px;
        }
        .polish-context-card-icon {
            width: 28px; height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }
        .polish-context-card-icon.doc { background: #eff6ff; color: #2563eb; }
        .polish-context-card-icon.kb { background: #f0fdf4; color: #10b981; }
        .polish-context-card-icon.struct { background: #fef3c7; color: #d97706; }
        .polish-context-card-body { flex: 1; min-width: 0; }
        .polish-context-card-title { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
        .polish-context-card-value { font-size: 12px; color: var(--text-primary); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .polish-context-card-tag {
            padding: 2px 6px;
            background: #f3f4f6;
            color: var(--text-muted);
            border-radius: 3px;
            font-size: 10px;
            flex-shrink: 0;
        }
        .polish-context-card-tag.auto { background: #d1fae5; color: #065f46; }
        .polish-context-card-tag.source { background: #eff6ff; color: #2563eb; }
        .polish-context-card.disabled .polish-context-card-value { color: var(--text-muted); }

        /* ===== 结构化审查消息 ===== */
        .polish-msg.assistant.review .polish-msg-bubble {
            background: transparent;
            padding: 0;
            max-width: 100%;
            width: 100%;
        }
        .review-analysis {
            background: #f9fafb;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }
        .review-analysis-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            user-select: none;
        }
        .review-analysis-header i.check { color: #10b981; font-size: 14px; }
        .review-analysis-header i.spinner {
            color: var(--text-muted);
            font-size: 12px;
            animation: aiRewriteSpin 0.8s linear infinite;
        }
        .review-analysis-toggle {
            margin-left: auto;
            font-size: 10px;
            color: var(--text-muted);
            transition: transform 0.2s;
        }
        .review-analysis.collapsed .review-analysis-toggle { transform: rotate(-90deg); }
        .review-analysis-body { padding: 0 14px 12px; }
        .review-analysis.collapsed .review-analysis-body { display: none; }
        .review-step { margin-bottom: 10px; }
        .review-step:last-child { margin-bottom: 0; }
        .review-step-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        .review-step-content {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
            padding-left: 12px;
            border-left: 2px solid var(--border-color);
        }

        /* 审查意见列表 */
        .review-list { margin-top: 8px; }
        .review-list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px 8px 0 0;
        }
        .review-list-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .review-list-actions { display: flex; gap: 6px; }
        .review-list-action-btn {
            padding: 4px 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: #fff;
            font-size: 11px;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: inherit;
        }
        .review-list-action-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        .review-list-action-btn.primary {
            background: var(--accent-primary);
            color: #fff;
            border-color: var(--accent-primary);
        }
        .review-list-action-btn.primary:hover { background: #1d4ed8; }
        .review-list-action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 修改建议点卡片 */
        .review-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-top: none;
            padding: 14px;
            transition: all 0.2s;
        }
        .review-card:last-child { border-radius: 0 0 8px 8px; }
        .review-card.applied { border-color: #10b981; background: #f0fdf4; }
        .review-card.ignored { opacity: 0.5; }
        /* v1.70 原文锚点失效态：黄色描边 + 浅黄底 */
        .review-card.anchor-lost { border-color: #d4a017; background: #fffdf5; }
        .review-card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .review-card-status {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 500;
        }
        .review-card-status.applied { background: #d1fae5; color: #065f46; }
        .review-card-status.ignored { background: #f3f4f6; color: var(--text-muted); }
        .review-card-status.anchor-lost { background: #fdf3d7; color: #92600a; cursor: help; }
        .review-card-section { margin-bottom: 10px; }
        .review-card-section:last-child { margin-bottom: 0; }
        .review-card-label {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 500;
        }
        .review-card-risk { font-size: 12px; color: #dc2626; line-height: 1.5; }
        .review-card-solution { font-size: 12px; color: #2563eb; line-height: 1.5; }
        .review-card-tabs { display: flex; gap: 4px; margin-bottom: 6px; }
        .review-card-tab {
            padding: 3px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #fff;
            font-size: 11px;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: inherit;
        }
        .review-card-tab.active {
            background: var(--accent-primary);
            color: #fff;
            border-color: var(--accent-primary);
        }
        .review-card-content {
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-primary);
            padding: 8px 10px;
            background: #f9fafb;
            border-radius: 4px;
        }
        .review-card-content ins { background: #d1fae5; text-decoration: none; color: #065f46; }
        .review-card-content del { background: #fee2e2; color: #991b1b; }
        .review-card-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .review-card-action-btn {
            padding: 4px 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: #fff;
            font-size: 11px;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: inherit;
        }
        .review-card-action-btn:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        .review-card-action-btn.primary {
            background: var(--accent-primary);
            color: #fff;
            border-color: var(--accent-primary);
        }
        .review-card-action-btn.primary:hover { background: #1d4ed8; }
        .review-card-action-btn.danger { color: #dc2626; border-color: #fecaca; }
        .review-card-action-btn.danger:hover { background: #fef2f2; }
        .review-card-action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .review-empty {
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 8px 8px;
        }

        /* 上传文书按钮（暂隐藏，功能代码保留，待场景闭环后开放） */
        .polish-action-btn.upload { display: none; }

        /* ===== 法条链接 Ctrl+点击查看 ===== */
        .law-ref-link {
            color: #2563eb;
            text-decoration: underline;
            text-underline-offset: 2px;
            cursor: pointer;
            position: relative;
            transition: color 0.15s;
        }
        .law-ref-link:hover {
            color: #1d4ed8;
        }
        /* tooltip：通过 data-law-tooltip 属性 + ::after 实现 */
        .law-ref-link[data-law-tooltip]:hover::after {
            content: attr(data-law-tooltip);
            position: absolute;
            left: 50%;
            bottom: calc(100% + 6px);
            transform: translateX(-50%);
            padding: 5px 10px;
            background: rgba(17, 24, 39, 0.92);
            color: #fff;
            font-size: 12px;
            line-height: 1.4;
            white-space: nowrap;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 50;
            pointer-events: none;
            font-family: "Microsoft YaHei", sans-serif;
            font-weight: normal;
            text-decoration: none;
        }
        .law-ref-link[data-law-tooltip]:hover::before {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 100%;
            transform: translateX(-50%);
            border: 4px solid transparent;
            border-top-color: rgba(17, 24, 39, 0.92);
            z-index: 50;
            pointer-events: none;
        }
        /* 编辑器内法条链接继承文书字体，保持版面整洁 */
        .doc-editor-paper .law-ref-link {
            font-family: inherit;
        }

        /* ===== 法条右键菜单 ===== */
        .law-ref-context-menu {
            position: fixed;
            z-index: 9999;
            min-width: 160px;
            max-width: 220px;
            display: none;
            padding: 4px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.12);
            font-family: "Microsoft YaHei", sans-serif;
        }
        .law-ref-menu-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 5px;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            transition: background 0.12s;
            white-space: nowrap;
        }
        .law-ref-menu-item:hover {
            background: var(--accent-light);
            color: var(--accent-primary);
        }
        .law-ref-menu-item i {
            font-size: 12px;
            color: var(--accent-primary);
            width: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="polish-header">
        <div class="polish-header-left">
            <button class="polish-back-btn" onclick="goBackToCase()" title="返回案件">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="polish-title-block">
                <div class="polish-title" id="polishDocTitle">文书精修</div>
                <div class="polish-subtitle" id="polishCaseName">-</div>
            </div>
        </div>
        <div class="polish-header-right">
            <button class="polish-action-btn upload" onclick="triggerUploadDocument()" title="上传本地文书进入精修">
                <i class="fas fa-upload"></i> 上传文书
            </button>
            <input type="file" id="uploadDocInput" accept=".html,.htm,.txt" style="display:none;" onchange="handleUploadDocument(event)">
        </div>
    </div>

    <!-- Body -->
    <div class="polish-body">
        <!-- Left: Document Content -->
        <div class="polish-doc-col">
            <div class="polish-doc-toolbar">
                <div class="toolbar-left">
                    <i class="fas fa-file-alt"></i>
                    <span>文书正文</span>
                    <span class="toolbar-tag" id="versionTag">原版本</span>
                </div>
                <div class="toolbar-right">
                    <span id="editHint" style="color:var(--text-muted);">精修指令将在此区域生效</span>
                </div>
            </div>
            <div class="polish-doc-content" id="docEditorRoot">
                <!-- 文档编辑器由 document-polish.js 初始化 -->
            </div>

            <!-- AI 改写浮动工具条 -->
            <div class="ai-rewrite-toolbar" id="aiRewriteToolbar">
                <button class="ai-rewrite-toolbar-btn" onclick="openAiRewriteCard()">
                    <i class="fas fa-sparkles"></i> 系统改写
                </button>
            </div>

            <!-- AI 改写卡片弹窗 -->
            <div class="ai-rewrite-card" id="aiRewriteCard">
                <div class="ai-rewrite-card-header">
                    <div class="ai-rewrite-card-title">
                        <i class="fas fa-sparkles"></i>
                        <span id="aiRewriteCardTitle"></span>
                    </div>
                    <button class="ai-rewrite-card-close" onclick="closeAiRewriteCard()" title="关闭">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="ai-rewrite-card-body" id="aiRewriteCardBody">
                    <!-- 动态填充 -->
                </div>
                <div class="ai-rewrite-footer-compact" id="aiRewriteFooterCompact">
                    <i class="fas fa-sparkles"></i>
                    <input type="text" id="aiRewriteInstruction" placeholder="输入优化指令" onkeydown="handleAiRewriteKeydown(event)">
                    <button class="ai-rewrite-send" onclick="sendAiRewriteInstruction()" title="按优化指令改写">
                        <i class="fas fa-arrow-up"></i>
                    </button>
                </div>
                <div class="ai-rewrite-actions" id="aiRewriteActions" style="display:none;">
                    <button class="ai-rewrite-action-btn" onclick="regenerateAiRewrite()">
                        <i class="fas fa-rotate-right"></i> 重写
                    </button>
                    <button class="ai-rewrite-action-btn" onclick="copyAiRewriteResult()">
                        <i class="fas fa-copy"></i> 复制
                    </button>
                    <button class="ai-rewrite-action-btn" onclick="insertAiRewriteResult()">
                        <i class="fas fa-arrow-down"></i> 插入
                    </button>
                    <button class="ai-rewrite-action-btn primary" onclick="replaceAiRewriteOriginal()">
                        <i class="fas fa-check"></i> 替换原文
                    </button>
                </div>
            </div>
        </div>

        <!-- Resizer（可拖动分隔条） -->
        <div class="polish-resizer" id="polishResizer" title="拖动调整宽度"></div>

        <!-- Right: Chat -->
        <div class="polish-chat-col">
            <div class="polish-chat-header">
                <i class="fas fa-comments"></i>
                <span>精修对话</span>
            </div>
            <div class="polish-chat-messages" id="chatMessages">
                <div class="polish-chat-empty">
                    <i class="fas fa-comment-dots"></i>
                    <div>输入修改需求，系统将定位原文并给出修改建议</div>
                    <div style="margin-top:6px;font-size:12px;">例如：重写本院认为部分、补充法条引用、检查格式问题</div>
                </div>
            </div>
            <div class="polish-chat-input-area">
                <textarea class="polish-chat-input" id="chatInput" placeholder="描述要修改的内容..." rows="1" onkeydown="handleChatKeydown(event)"></textarea>
                <button class="polish-send-btn" id="sendBtn" onclick="sendPolishMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="../js/common.js?v=30"></script>
    <script src="../js/case-data.js?v=65"></script>
    <script src="../js/doc-editor.js?v=3"></script>
    <script src="../js/document-polish.js?v=21"></script>
</body>
</html>
