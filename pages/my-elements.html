<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>我的要件 - AI辅助办案系统</title>
    <link href="../libs/font-awesome-all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --accent-primary: #2563eb;
            --accent-light: #eff6ff;
            --danger-color: #dc2626;
            --success-color: #16a34a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .page-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 24px;
        }
        .page-header {
            margin-bottom: 28px;
        }
        .page-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .page-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .page-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--accent-primary);
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
        .main-layout {
            display: flex;
            gap: 20px;
        }
        .cause-sidebar {
            width: 260px;
            flex-shrink: 0;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }
        .cause-list {
            max-height: calc(100vh - 260px);
            overflow-y: auto;
            padding: 8px;
        }
        /* 左侧搜索框 */
        .cause-search-wrap { padding: 4px 4px 8px; position: sticky; top: -8px; background: var(--bg-primary); z-index: 5; }
        .cause-search-box { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; }
        .cause-search-box:focus-within { border-color: var(--accent-primary); }
        .cause-search-box i { color: var(--text-muted); font-size: 12px; }
        .cause-search-box input { border: none; outline: none; background: transparent; font-size: 13px; flex: 1; font-family: inherit; color: var(--text-primary); }
        .cause-search-box input::placeholder { color: var(--text-muted); }
        .cause-search-clear { cursor: pointer; color: var(--text-muted); font-size: 12px; display: none; }
        .cause-search-clear:hover { color: var(--text-primary); }

        /* 置顶分组 */
        .pinned-section { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--border-color); }
        .pinned-header { display: flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }
        .pinned-header i { font-size: 10px; color: var(--accent-primary); }

        /* 左侧案由树（3 级结构，与新增案件案由选择器一致） */
        .cause-tree-root { display: flex; flex-direction: column; gap: 2px; }
        .cause-tree-all { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; transition: all 0.15s; margin-bottom: 4px; }
        .cause-tree-all:hover { background: var(--bg-secondary); color: var(--text-primary); }
        .cause-tree-all.active { background: var(--accent-light); color: var(--accent-primary); font-weight: 500; }
        .cause-tree-all .count { margin-left: auto; font-size: 11px; color: var(--text-muted); background: var(--bg-tertiary); padding: 1px 6px; border-radius: 8px; }
        .cause-tree-all.active .count { background: #dbeafe; color: var(--accent-primary); }

        .cause-level-1 { display: flex; flex-direction: column; }
        .cause-level-1-header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
        .cause-level-1-header:hover { background: var(--bg-secondary); }
        .cause-level-1-header.selected { background: var(--accent-light); }
        .cause-level-1-header.selected .cause-level-1-name { color: var(--accent-primary); font-weight: 600; }
        .cause-level-1-name { font-size: 13px; font-weight: 600; color: var(--text-primary); flex: 1; }
        .cause-level-1-header .count { font-size: 11px; color: var(--text-muted); }
        .cause-expand-icon { font-size: 10px; color: var(--text-muted); transition: transform 0.2s; width: 12px; text-align: center; }
        .cause-level-1.expanded > .cause-level-1-header .cause-expand-icon { transform: rotate(90deg); }
        .cause-level-2-container { display: none; flex-direction: column; gap: 2px; padding-left: 16px; padding-bottom: 4px; }
        .cause-level-1.expanded > .cause-level-2-container { display: flex; }

        .cause-level-2 { display: flex; flex-direction: column; }
        .cause-level-2-header { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
        .cause-level-2-header:hover { background: var(--bg-secondary); }
        .cause-level-2-header.selected { background: var(--accent-light); }
        .cause-level-2-header.selected .cause-level-2-name { color: var(--accent-primary); font-weight: 600; }
        .cause-level-2-name { font-size: 12px; font-weight: 500; color: var(--text-primary); flex: 1; }
        .cause-level-2-header .count { font-size: 11px; color: var(--text-muted); }
        .cause-level-2.expanded > .cause-level-2-header .cause-expand-icon { transform: rotate(90deg); }
        .cause-level-3-container { display: none; flex-direction: column; gap: 2px; padding-left: 16px; padding-bottom: 4px; }
        .cause-level-2.expanded > .cause-level-3-container { display: flex; }

        .cause-leaf { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
        .cause-leaf:hover { background: var(--bg-secondary); }
        .cause-leaf.active { background: var(--accent-light); color: var(--accent-primary); font-weight: 500; }
        .cause-leaf .has-mine-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-primary); flex-shrink: 0; }
        .cause-leaf-name { font-size: 12px; color: var(--text-primary); flex: 1; }
        .cause-leaf.active .cause-leaf-name { color: var(--accent-primary); }
        .cause-leaf .count { font-size: 10px; color: var(--text-muted); background: var(--bg-tertiary); padding: 1px 5px; border-radius: 8px; }
        .cause-leaf.active .count { background: #dbeafe; color: var(--accent-primary); }
        .pin-btn { cursor: pointer; color: var(--text-muted); font-size: 11px; opacity: 0; transition: all 0.15s; flex-shrink: 0; padding: 2px; }
        .cause-leaf:hover .pin-btn { opacity: 0.6; }
        .pin-btn:hover { opacity: 1 !important; color: var(--accent-primary); }
        .pin-btn.pinned { opacity: 1; color: var(--accent-primary); }
        .pinned-section .cause-leaf .pin-btn { opacity: 1; color: var(--accent-primary); }
        .no-match-tip { padding: 16px 12px; text-align: center; font-size: 12px; color: var(--text-muted); }

        .page-header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .business-switch { display: flex; gap: 4px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; padding: 4px; }
        .business-switch-btn { padding: 6px 14px; border: none; background: transparent; color: var(--text-secondary); font-size: 13px; font-weight: 500; border-radius: 6px; cursor: pointer; transition: all 0.15s; font-family: inherit; }
        .business-switch-btn.active { background: var(--accent-primary); color: white; }
        .content-area {
            flex: 1;
            min-width: 0;
        }
        .section-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 15px;
            font-weight: 600;
        }
        .section-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            border: 1px solid transparent;
            transition: all 0.15s;
        }
        .btn-primary { background: var(--accent-primary); color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: var(--bg-secondary); color: var(--text-secondary); border-color: var(--border-color); }
        .btn-secondary:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
        .btn-danger { background: #fef2f2; color: var(--danger-color); border-color: #fecaca; }
        .btn-danger:hover { background: #fee2e2; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .element-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .element-item {
            padding: 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
        }
        .element-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }
        .element-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .element-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .element-question {
            font-size: 13px;
            color: var(--text-primary);
            padding: 8px 10px;
            background: var(--bg-primary);
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
        .element-actions {
            display: flex;
            gap: 6px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .form-input, .form-textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--bg-primary);
            outline: none;
        }
        .form-input:focus, .form-textarea:focus { border-color: var(--accent-primary); }
        .form-textarea { min-height: 60px; resize: vertical; }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 13px;
        }
        .empty-state i { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 18px;
            background: var(--text-primary);
            color: #fff;
            border-radius: 8px;
            font-size: 13px;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }
        .toast.show { opacity: 1; visibility: visible; }
        .toast.success { background: var(--success-color); }

        /* 案字适配选择栏 */
        .case-word-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border-color); background: var(--bg-secondary); flex-wrap: wrap; border-radius: 10px 10px 0 0; }
        .case-word-bar .cw-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
        .case-word-bar .cw-chips { display: flex; gap: 6px; flex-wrap: wrap; }
        .cw-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px; font-size: 12px; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-secondary); transition: all 0.15s; user-select: none; }
        .cw-chip:hover { border-color: var(--accent-primary); }
        .cw-chip.checked { background: var(--accent-light); border-color: var(--accent-primary); color: var(--accent-primary); font-weight: 500; }
        .cw-chip .cw-check { display: none; font-size: 9px; }
        .cw-chip.checked .cw-check { display: inline; }
        /* 优化2: 不在白名单的案字（已有数据保留显示，禁止勾选） */
        .cw-chip.disabled { opacity: 0.4; cursor: not-allowed; text-decoration: line-through; }
        .cw-chip.disabled:hover { border-color: var(--border-color); }
        .case-word-bar .cw-hint { font-size: 11px; color: var(--text-muted); margin-left: auto; }

        /* 要件卡片上的案字标签 */
        .cw-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
        .cw-tag { display: inline-block; padding: 1px 6px; border-radius: 8px; font-size: 10px; background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border-color); }
        .cw-tag.universal { background: #fef3c7; color: #92400e; border-color: #fde68a; }

        /* 表单中的适用案字多选 */
        .form-cw-select { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-primary); min-height: 40px; }
        .form-cw-empty { font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="page-container">
        <a href="cases.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回案件列表</a>
        <div class="page-header-row">
            <div class="page-header">
                <div class="page-title">我的要件</div>
                <div class="page-subtitle">按案由维护个人自定义要件，生成文书时与标准要件一同作为可选上下文</div>
            </div>
            <div class="business-switch" id="businessSwitch">
                <button class="business-switch-btn active" data-type="court" onclick="switchBusiness('court')">法院</button>
                <button class="business-switch-btn" data-type="procuratorate" onclick="switchBusiness('procuratorate')">检察院</button>
                <button class="business-switch-btn" data-type="justice" onclick="switchBusiness('justice')">司法局</button>
            </div>
        </div>
        <div style="margin-bottom:16px;padding:10px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;color:#1e40af;font-size:13px;display:flex;align-items:center;gap:8px;">
            <i class="fas fa-info-circle"></i>
            <span>此处维护的「我的要件」仅在生成「裁判文书」类文书时才会询问是否引入辅助生成；其他文书类型（庭审提纲、执行文书、材料总结等）不会触发要件引入。</span>
        </div>

        <div class="main-layout">
            <div class="cause-sidebar">
                <div class="sidebar-header">选择案由</div>
                <div class="cause-list">
                    <div class="cause-search-wrap">
                        <div class="cause-search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="causeSearchInput" placeholder="搜索案由..." oninput="filterCauseTree()">
                            <i class="fas fa-times-circle cause-search-clear" id="causeSearchClear" onclick="clearCauseSearch()"></i>
                        </div>
                    </div>
                    <div id="causeList"></div>
                </div>
            </div>

            <div class="content-area">
                <div class="section-card">
                    <div class="section-card-header">
                        <div>
                            <div class="section-title" id="currentCauseTitle">请选择一个案由</div>
                            <div class="section-desc">在此案由下新增、编辑、删除个人自定义要件</div>
                        </div>
                        <button class="btn btn-primary" id="addElementBtn" onclick="addMyElement()" style="display:none;">
                            <i class="fas fa-plus"></i> 新增我的要件
                        </button>
                    </div>

                    <div id="myElementsSection" style="display:none;">
                        <div class="case-word-bar" id="caseWordBar" style="display:none;">
                            <span class="cw-label">适配案字：</span>
                            <div class="cw-chips" id="caseWordChips"></div>
                            <span class="cw-hint">勾选该案由适用的案字；不勾选则适配全部</span>
                        </div>
                        <div class="element-list" id="myElementList"></div>
                    </div>

                    <div class="empty-state" id="emptyState">
                        <i class="fas fa-folder-open"></i>
                        <div>请从左侧选择一个案由进行管理</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../js/case-data.js?v=54"></script>
    <script>
        const causeListEl = document.getElementById('causeList');
        const currentCauseTitleEl = document.getElementById('currentCauseTitle');
        const myElementsSection = document.getElementById('myElementsSection');
        const myElementList = document.getElementById('myElementList');
        const emptyState = document.getElementById('emptyState');
        const addElementBtn = document.getElementById('addElementBtn');

        // case-data.js 已声明全局 currentBusiness，此处直接复用/覆盖，不可重新 let/const
        currentBusiness = localStorage.getItem('currentBusiness') || currentBusiness || 'court';
        let currentCause = '';
        let editingId = null;
        let searchKeyword = '';
        const PINNED_KEY = 'myPinnedCauses';
        const MY_CW_KEY = 'myCauseCaseWords';

        // ===== 案字适配存储（按业务系统 × 案由分组） =====
        function getMyCwStorage() {
            try { return JSON.parse(localStorage.getItem(MY_CW_KEY)) || {}; }
            catch (e) { return {}; }
        }
        function getMyCauseCaseWords(org, cause) {
            if (!cause) return [];
            return (getMyCwStorage()[org] || {})[cause] || [];
        }
        function setMyCauseCaseWords(org, cause, words) {
            const all = getMyCwStorage();
            if (!all[org]) all[org] = {};
            if (!words || words.length === 0) {
                delete all[org][cause];
            } else {
                all[org][cause] = words;
            }
            localStorage.setItem(MY_CW_KEY, JSON.stringify(all));
        }
        function getCaseWordList(org) {
            return (typeof caseWordListByOrg !== 'undefined' && caseWordListByOrg[org]) || [];
        }

        // ===== 渲染案字适配栏 =====
        function renderCaseWordBar() {
            const cwBar = document.getElementById('caseWordBar');
            const cwChips = document.getElementById('caseWordChips');
            if (!cwBar || !cwChips) return;
            const allWords = getCaseWordList(currentBusiness);
            if (!allWords.length) {
                cwBar.style.display = 'none';
                return;
            }
            cwBar.style.display = 'flex';
            // 优化2: 按案由大类白名单过滤，不在白名单的案字（已有数据）保留显示但禁用
            const allowed = (typeof getAllowedCaseWordsForCause === 'function')
                ? getAllowedCaseWordsForCause(currentBusiness, currentCause)
                : allWords.slice();
            const selected = getMyCauseCaseWords(currentBusiness, currentCause);
            const merged = allowed.slice();
            selected.forEach(w => { if (merged.indexOf(w) < 0) merged.push(w); });
            cwChips.innerHTML = merged.map(w => {
                const checked = selected.indexOf(w) >= 0 ? ' checked' : '';
                const disabled = allowed.indexOf(w) < 0 ? ' disabled' : '';
                const onclick = disabled ? '' : ' onclick="toggleCauseCaseWord(\'' + escQuote(w) + '\')"';
                return '<span class="cw-chip' + checked + disabled + '"' + onclick + ' title="' + (disabled ? '该案字不在当前案由允许范围' : '') + '">'
                    + '<i class="fas fa-check cw-check"></i>'
                    + escapeHtml(w)
                    + '</span>';
            }).join('');
        }

        function toggleCauseCaseWord(word) {
            // 优化2: 白名单守卫
            const allowed = (typeof getAllowedCaseWordsForCause === 'function')
                ? getAllowedCaseWordsForCause(currentBusiness, currentCause)
                : getCaseWordList(currentBusiness);
            if (allowed.indexOf(word) < 0) {
                showToast('该案字不在当前案由允许范围', 'error');
                return;
            }
            const list = getMyCauseCaseWords(currentBusiness, currentCause);
            const idx = list.indexOf(word);
            if (idx >= 0) list.splice(idx, 1);
            else list.push(word);
            setMyCauseCaseWords(currentBusiness, currentCause, list);
            renderCaseWordBar();
        }

        // 渲染表单中的适用案字多选
        // 优化2: 表单内只展示白名单案字，已选但不在白名单的保留显示但禁用
        function renderFormCaseWords(idx, selected) {
            const container = document.getElementById('formCaseWords_' + idx);
            if (!container) return;
            const allowed = (typeof getAllowedCaseWordsForCause === 'function')
                ? getAllowedCaseWordsForCause(currentBusiness, currentCause)
                : getCaseWordList(currentBusiness);
            const sel = selected || [];
            const merged = allowed.slice();
            sel.forEach(w => { if (merged.indexOf(w) < 0) merged.push(w); });
            if (!merged.length) {
                container.innerHTML = '<span class="form-cw-empty">当前业务系统无案字配置</span>';
                return;
            }
            container.innerHTML = merged.map(w => {
                const checked = sel.indexOf(w) >= 0 ? ' checked' : '';
                const disabled = allowed.indexOf(w) < 0 ? ' disabled' : '';
                return '<span class="cw-chip' + checked + disabled + '" data-cw="' + escapeHtml(w) + '" onclick="toggleFormCaseWord(this)" title="' + (disabled ? '该案字不在当前案由允许范围' : '') + '">'
                    + '<i class="fas fa-check cw-check"></i>'
                    + escapeHtml(w)
                    + '</span>';
            }).join('');
        }

        function toggleFormCaseWord(el) {
            // 优化2: 禁用态不响应点击
            if (el.classList.contains('disabled')) return;
            el.classList.toggle('checked');
        }

        // 收集表单中已勾选的案字
        function collectFormCaseWords(idx) {
            const chips = document.querySelectorAll('#formCaseWords_' + idx + ' .cw-chip.checked');
            return Array.from(chips).map(c => c.getAttribute('data-cw') || '');
        }

        // 渲染要件卡片上的案字标签
        function renderElementCwTags(caseWords) {
            if (!Array.isArray(caseWords) || caseWords.length === 0) {
                return '<div class="cw-tags"><span class="cw-tag universal">通用</span></div>';
            }
            return '<div class="cw-tags">' + caseWords.map(w => '<span class="cw-tag">' + escapeHtml(w) + '</span>').join('') + '</div>';
        }

        // ===== 置顶案由存储（按业务系统分组） =====
        function getPinned(org) {
            try {
                const all = JSON.parse(localStorage.getItem(PINNED_KEY) || '{}');
                return all[org] || [];
            } catch (e) { return []; }
        }
        function setPinned(org, list) {
            let all = {};
            try { all = JSON.parse(localStorage.getItem(PINNED_KEY) || '{}'); } catch (e) {}
            all[org] = list;
            localStorage.setItem(PINNED_KEY, JSON.stringify(all));
        }
        function isPinned(org, name) {
            return getPinned(org).indexOf(name) >= 0;
        }
        function matchSearch(name) {
            if (!searchKeyword) return true;
            return name.toLowerCase().indexOf(searchKeyword.toLowerCase()) >= 0;
        }

        function init() {
            // 同步业务系统按钮状态
            document.querySelectorAll('.business-switch-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === currentBusiness);
            });

            const urlCause = getUrlParam('cause');
            if (urlCause) {
                currentCause = urlCause;
                // 展开 URL 案由所在的父级节点
                expandCausePath(urlCause);
            }
            renderCauseList();
            if (currentCause) {
                renderElements();
            }
        }

        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name) || '';
        }

        function getCauseTree() {
            return causeTreeDataByOrg[currentBusiness] || causeTreeDataByOrg.court || [];
        }

        // 展开 URL 传入案由所在的 level-1 / level-2 父节点
        function expandCausePath(causeName) {
            const tree = getCauseTree();
            tree.forEach(l1 => {
                let found = false;
                (l1.children || []).forEach(l2 => {
                    if (typeof l2 === 'string') {
                        if (l2 === causeName) found = true;
                    } else if (Array.isArray(l2.children)) {
                        if (l2.children.indexOf(causeName) >= 0) {
                            found = true;
                            l2.expanded = true;
                        }
                    }
                });
                if (found) l1.expanded = true;
            });
        }

        // 统计某节点下所有叶子案由的数量
        function countLeaves(node) {
            if (!node || !node.children) return 0;
            let cnt = 0;
            node.children.forEach(child => {
                if (typeof child === 'string') cnt += 1;
                else if (child && Array.isArray(child.children)) cnt += child.children.length;
            });
            return cnt;
        }

        function escQuote(s) {
            if (!s) return '';
            return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // 渲染左侧案由树（3 级结构）
        function renderCauseList() {
            const tree = getCauseTree();
            const myData = getMyElementPresets();
            const totalLeaves = tree.reduce((sum, l1) => sum + countLeaves(l1), 0);
            const pinned = getPinned(currentBusiness);

            let html = '<div class="cause-tree-root">'
                + '<div class="cause-tree-all' + (currentCause === '' ? ' active' : '') + '" onclick="selectCause(\'\')">'
                + '<i class="fas fa-layer-group"></i><span>全部</span>'
                + '<span class="count">' + totalLeaves + '</span></div>';

            // 置顶分组（仅在非搜索状态下显示）
            if (!searchKeyword && pinned.length > 0) {
                html += '<div class="pinned-section">'
                    + '<div class="pinned-header"><i class="fas fa-thumbtack"></i><span>置顶</span></div>';
                pinned.forEach(name => {
                    html += renderCauseLeaf(name, myData);
                });
                html += '</div>';
            }

            // 树形结构
            let hasMatch = false;
            tree.forEach((l1, i1) => {
                // 搜索时判断该 l1 下是否有匹配的叶子
                let l1HasMatch = false;
                if (searchKeyword) {
                    (l1.children || []).forEach(l2 => {
                        if (typeof l2 === 'string') {
                            if (matchSearch(l2)) l1HasMatch = true;
                        } else {
                            (l2.children || []).forEach(leaf => {
                                if (matchSearch(leaf)) l1HasMatch = true;
                            });
                        }
                    });
                } else {
                    l1HasMatch = true;
                }
                if (!l1HasMatch) return;

                const l1ForceExpanded = searchKeyword ? ' expanded' : (l1.expanded ? ' expanded' : '');
                const l1Selected = currentCause === l1.name ? ' selected' : '';
                const l1Count = countLeaves(l1);
                html += '<div class="cause-level-1' + l1ForceExpanded + '">'
                    + '<div class="cause-level-1-header' + l1Selected + '">'
                    + '<i class="fas fa-chevron-right cause-expand-icon" onclick="event.stopPropagation(); toggleCauseLevel1(' + i1 + ')"></i>'
                    + '<span class="cause-level-1-name" onclick="event.stopPropagation(); selectCause(\'' + escQuote(l1.name) + '\')">' + escapeHtml(l1.name) + '</span>'
                    + '<span class="count">' + l1Count + '</span>'
                    + '</div>'
                    + '<div class="cause-level-2-container">';

                (l1.children || []).forEach((l2, i2) => {
                    if (typeof l2 === 'string') {
                        if (matchSearch(l2)) {
                            html += renderCauseLeaf(l2, myData);
                            hasMatch = true;
                        }
                    } else {
                        let l2HasMatch = false;
                        if (searchKeyword) {
                            (l2.children || []).forEach(leaf => {
                                if (matchSearch(leaf)) l2HasMatch = true;
                            });
                        } else {
                            l2HasMatch = true;
                        }
                        if (!l2HasMatch) return;

                        const l2ForceExpanded = searchKeyword ? ' expanded' : (l2.expanded ? ' expanded' : '');
                        const l2Selected = currentCause === l2.name ? ' selected' : '';
                        const l2Count = (l2.children || []).length;
                        html += '<div class="cause-level-2' + l2ForceExpanded + '">'
                            + '<div class="cause-level-2-header' + l2Selected + '">'
                            + '<i class="fas fa-chevron-right cause-expand-icon" onclick="event.stopPropagation(); toggleCauseLevel2(' + i1 + ',' + i2 + ')"></i>'
                            + '<span class="cause-level-2-name" onclick="event.stopPropagation(); selectCause(\'' + escQuote(l2.name) + '\')">' + escapeHtml(l2.name) + '</span>'
                            + '<span class="count">' + l2Count + '</span>'
                            + '</div>'
                            + '<div class="cause-level-3-container">';
                        (l2.children || []).forEach(leaf => {
                            if (matchSearch(leaf)) {
                                html += renderCauseLeaf(leaf, myData);
                                hasMatch = true;
                            }
                        });
                        html += '</div></div>';
                    }
                });

                html += '</div></div>';
            });

            // 搜索无匹配提示
            if (searchKeyword && !hasMatch) {
                html += '<div class="no-match-tip"><i class="fas fa-search" style="margin-right:6px;opacity:0.4;"></i>无匹配案由</div>';
            }

            html += '</div>';
            causeListEl.innerHTML = html;
        }

        // 渲染叶子案由项
        function renderCauseLeaf(name, myData) {
            const myCount = (myData[name] || []).length;
            const dot = myCount > 0
                ? '<span class="has-mine-dot" title="已配置我的要件"></span>'
                : '<span class="has-mine-dot" style="visibility:hidden;"></span>';
            const pinned = isPinned(currentBusiness, name);
            const pinClass = pinned ? 'pin-btn pinned' : 'pin-btn';
            const pinTitle = pinned ? '取消置顶' : '置顶';
            return '<div class="cause-leaf' + (currentCause === name ? ' active' : '') + '" onclick="selectCause(\'' + escQuote(name) + '\')">'
                + dot
                + '<span class="cause-leaf-name">' + escapeHtml(name) + '</span>'
                + (myCount > 0 ? '<span class="count">' + myCount + '</span>' : '')
                + '<i class="fas fa-thumbtack ' + pinClass + '" title="' + pinTitle + '" onclick="event.stopPropagation(); togglePinCause(\'' + escQuote(name) + '\')"></i>'
                + '</div>';
        }

        function toggleCauseLevel1(i1) {
            const tree = getCauseTree();
            if (tree[i1]) {
                tree[i1].expanded = !tree[i1].expanded;
                renderCauseList();
            }
        }

        function toggleCauseLevel2(i1, i2) {
            const tree = getCauseTree();
            const l2 = tree[i1] && tree[i1].children && tree[i1].children[i2];
            if (l2 && typeof l2 !== 'string') {
                l2.expanded = !l2.expanded;
                renderCauseList();
            }
        }

        function switchBusiness(type) {
            if (type === currentBusiness) return;
            currentBusiness = type;
            localStorage.setItem('currentBusiness', type);
            document.querySelectorAll('.business-switch-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });
            currentCause = '';
            editingId = null;
            searchKeyword = '';
            const searchInput = document.getElementById('causeSearchInput');
            if (searchInput) searchInput.value = '';
            const clearBtn = document.getElementById('causeSearchClear');
            if (clearBtn) clearBtn.style.display = 'none';
            renderCauseList();
            renderElements();
        }

        function togglePinCause(name) {
            const list = getPinned(currentBusiness);
            const idx = list.indexOf(name);
            if (idx >= 0) {
                list.splice(idx, 1);
                showToast('已取消置顶「' + name + '」', 'success');
            } else {
                list.push(name);
                showToast('已置顶「' + name + '」', 'success');
            }
            setPinned(currentBusiness, list);
            renderCauseList();
        }

        function filterCauseTree() {
            const input = document.getElementById('causeSearchInput');
            const clearBtn = document.getElementById('causeSearchClear');
            searchKeyword = (input.value || '').trim();
            clearBtn.style.display = searchKeyword ? 'block' : 'none';
            renderCauseList();
        }

        function clearCauseSearch() {
            const input = document.getElementById('causeSearchInput');
            input.value = '';
            searchKeyword = '';
            document.getElementById('causeSearchClear').style.display = 'none';
            renderCauseList();
            input.focus();
        }

        function selectCause(cause) {
            currentCause = cause;
            editingId = null;
            renderCauseList();
            renderElements();
        }

        function renderElements() {
            if (!currentCause) {
                emptyState.style.display = 'block';
                myElementsSection.style.display = 'none';
                addElementBtn.style.display = 'none';
                currentCauseTitleEl.textContent = '请选择一个案由';
                return;
            }

            emptyState.style.display = 'none';
            currentCauseTitleEl.textContent = currentCause;
            addElementBtn.style.display = 'inline-flex';

            renderCaseWordBar();
            renderMyElements();
            myElementsSection.style.display = 'block';
        }

        function renderMyElements() {
            const mine = getMyElementPresets(currentCause);
            if (mine.length === 0 && editingId !== -1) {
                myElementList.innerHTML = `<div class="empty-state" style="padding:24px;"><div>尚未添加自定义要件</div></div>`;
                return;
            }
            const items = mine.map((p, idx) => {
                if (editingId === idx) {
                    return renderMyElementForm(p, idx);
                }
                return `
                    <div class="element-item">
                        <div class="element-header">
                            <div style="flex:1;min-width:0;">
                                <div class="element-name">${p.name}</div>
                                <div class="element-desc">${p.desc || ''}</div>
                                <div class="element-question">${p.question || ''}</div>
                                ${renderElementCwTags(p.caseWords)}
                            </div>
                            <div class="element-actions">
                                <button class="btn btn-secondary btn-sm" onclick="editMyElement(${idx})"><i class="fas fa-edit"></i> 编辑</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteMyElement(${idx})"><i class="fas fa-trash"></i> 删除</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            if (editingId === -1) {
                items.push(renderMyElementForm(null, -1));
            }
            myElementList.innerHTML = items.join('');
        }

        function renderMyElementForm(item, idx) {
            const data = item || { name: '', desc: '', question: '', caseWords: [] };
            return `
                <div class="element-item" style="background:var(--accent-light);border-color:#bfdbfe;">
                    <div class="form-group">
                        <label class="form-label">要件名称</label>
                        <input type="text" class="form-input" id="editName_${idx}" value="${escapeHtml(data.name)}" placeholder="如：借款用途">
                    </div>
                    <div class="form-group">
                        <label class="form-label">要件说明</label>
                        <input type="text" class="form-input" id="editDesc_${idx}" value="${escapeHtml(data.desc || '')}" placeholder="简要说明该要件的含义">
                    </div>
                    <div class="form-group">
                        <label class="form-label">问题</label>
                        <textarea class="form-textarea" id="editQuestion_${idx}" placeholder="生成文书前需要确认的单一问题">${escapeHtml(data.question || '')}</textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">适用案字</label>
                        <div class="form-cw-select" id="formCaseWords_${idx}"></div>
                        <div class="form-hint" style="font-size:11px;color:var(--text-muted);margin-top:4px;">勾选该要件适用的案字；不勾选 = 通用（该案由下所有案字适用）</div>
                    </div>
                    <div class="element-actions" style="justify-content:flex-end;">
                        <button class="btn btn-secondary btn-sm" onclick="cancelEdit()">取消</button>
                        <button class="btn btn-primary btn-sm" onclick="saveMyElement(${idx})">保存</button>
                    </div>
                </div>
            `;
        }

        function addMyElement() {
            editingId = -1;
            renderMyElements();
            renderFormCaseWords(-1, []);
            const input = document.getElementById('editName_-1');
            if (input) input.focus();
        }

        function editMyElement(idx) {
            editingId = idx;
            const mine = getMyElementPresets(currentCause);
            const item = mine[idx] || {};
            const cw = Array.isArray(item.caseWords) ? item.caseWords : [];
            renderMyElements();
            renderFormCaseWords(idx, cw);
        }

        function cancelEdit() {
            editingId = null;
            renderMyElements();
        }

        function saveMyElement(idx) {
            const name = document.getElementById(`editName_${idx}`).value.trim();
            const desc = document.getElementById(`editDesc_${idx}`).value.trim();
            const question = document.getElementById(`editQuestion_${idx}`).value.trim();
            if (!name || !question) {
                showToast('要件名称和问题不能为空', 'error');
                return;
            }
            const caseWords = collectFormCaseWords(idx);
            const mine = getMyElementPresets(currentCause);
            if (idx === -1) {
                mine.push({ name, desc, question, caseWords });
            } else {
                mine[idx] = { name, desc, question, caseWords };
            }
            setMyElementPresets(currentCause, mine);
            editingId = null;
            renderCauseList();
            renderMyElements();
            showToast('保存成功', 'success');
        }

        function deleteMyElement(idx) {
            if (!confirm('确定删除该要件吗？')) return;
            const mine = getMyElementPresets(currentCause);
            mine.splice(idx, 1);
            setMyElementPresets(currentCause, mine);
            renderCauseList();
            renderMyElements();
            showToast('删除成功', 'success');
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + (type || '');
            setTimeout(() => { toast.className = 'toast'; }, 2500);
        }

        init();
    </script>
</body>
</html>
