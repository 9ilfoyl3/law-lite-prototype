<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>我的提示词 - AI辅助办案系统</title>
    <link href="../libs/font-awesome-all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --accent-primary: #2563eb;
            --accent-light: #eff6ff;
            --accent-warning: #f59e0b;
            --danger-color: #dc2626;
            --success-color: #16a34a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .page-container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 13px; color: var(--accent-primary); text-decoration: none;
            margin-bottom: 12px;
        }
        .back-link:hover { text-decoration: underline; }
        .page-header { margin-bottom: 20px; }
        .page-title { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
        .page-subtitle { font-size: 14px; color: var(--text-secondary); }
        .business-switch { display: flex; gap: 4px; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 8px; padding: 4px; }
        .business-switch-btn {
            padding: 6px 14px; border: none; background: transparent;
            color: var(--text-secondary); font-size: 13px; font-weight: 500;
            border-radius: 6px; cursor: pointer; transition: all 0.15s; font-family: inherit;
        }
        .business-switch-btn.active { background: var(--accent-primary); color: white; }

        .main-layout { display: flex; gap: 20px; }
        .left-sidebar {
            width: 220px; flex-shrink: 0;
            background: var(--bg-primary); border: 1px solid var(--border-color);
            border-radius: 12px; overflow: hidden;
        }
        .sidebar-header {
            padding: 14px 16px; font-size: 14px; font-weight: 600;
            border-bottom: 1px solid var(--border-color); background: var(--bg-secondary);
        }
        .left-list { max-height: calc(100vh - 280px); overflow-y: auto; }
        .left-item {
            padding: 10px 14px; font-size: 13px; cursor: pointer;
            border-bottom: 1px solid var(--border-color); transition: all 0.15s;
            display: flex; justify-content: space-between; align-items: center; gap: 6px;
        }
        .left-item:last-child { border-bottom: none; }
        .left-item:hover { background: var(--bg-secondary); }
        .left-item.active { background: var(--accent-light); color: var(--accent-primary); font-weight: 500; }
        .left-item .count { font-size: 11px; color: var(--text-muted); background: var(--bg-tertiary); padding: 1px 6px; border-radius: 8px; }
        .left-item.active .count { background: #dbeafe; color: var(--accent-primary); }

        .content-area { flex: 1; min-width: 0; }
        .content-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px;
        }
        .content-title { font-size: 16px; font-weight: 600; }
        .btn {
            padding: 8px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
            border: none; transition: all 0.15s; font-family: inherit;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: var(--accent-primary); color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-secondary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: #e2e8f0; }

        .item-list { display: flex; flex-direction: column; gap: 10px; }
        .item-card {
            background: var(--bg-primary); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 14px 16px;
        }
        .item-card.editing { border-color: var(--accent-primary); background: var(--accent-light); }
        .item-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .item-name { font-size: 14px; font-weight: 500; color: var(--text-primary); }
        .item-badge {
            display: inline-block; padding: 2px 8px; border-radius: 10px;
            font-size: 11px; font-weight: 500; margin-left: 6px;
            background: #d1fae5; color: #065f46;
        }
        .item-badge.status-on { background: #d1fae5; color: #065f46; }
        .item-badge.status-off { background: #f3f4f6; color: #6b7280; }
        .item-meta { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
        .item-text-preview {
            font-size: 12px; color: var(--text-secondary); margin-top: 6px;
            padding: 6px 8px; background: var(--bg-secondary); border-radius: 4px;
            line-height: 1.5; white-space: pre-wrap; word-break: break-all;
            max-height: 80px; overflow: hidden;
        }
        .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .action-btn {
            padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer;
            border: 1px solid var(--border-color); background: var(--bg-primary); color: #374151;
            transition: all 0.15s; font-family: inherit;
        }
        .action-btn:hover { background: var(--bg-secondary); }
        .action-btn.edit { color: var(--accent-primary); border-color: #bfdbfe; }
        .action-btn.edit:hover { background: var(--accent-light); }
        .action-btn.delete { color: var(--danger-color); border-color: #fecaca; }
        .action-btn.delete:hover { background: #fef2f2; }
        .action-btn.toggle-on { color: var(--success-color); border-color: #bbf7d0; }
        .action-btn.toggle-on:hover { background: #f0fdf4; }
        .action-btn.toggle-off { color: var(--accent-warning); border-color: #fde68a; }
        .action-btn.toggle-off:hover { background: #fffbeb; }

        .form-group { margin-bottom: 12px; }
        .form-label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .form-label .required { color: var(--danger-color); }
        .form-input, .form-select, .form-textarea {
            width: 100%; padding: 7px 10px; border: 1px solid var(--border-color);
            border-radius: 6px; font-size: 13px; background: var(--bg-primary);
            color: var(--text-primary); font-family: inherit; box-sizing: border-box;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent-primary); }
        .form-textarea { resize: vertical; min-height: 90px; line-height: 1.5; }
        .form-hint { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
        .form-actions { display: flex; gap: 8px; margin-top: 12px; }

        .empty-state {
            text-align: center; padding: 60px 20px; color: var(--text-muted);
            background: var(--bg-primary); border: 1px dashed var(--border-color);
            border-radius: 12px;
        }
        .empty-state i { font-size: 40px; margin-bottom: 10px; color: var(--border-color); }
        .empty-state p { font-size: 13px; margin: 0; }
        .empty-state .hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

        .toast {
            position: fixed; top: 20px; right: 20px; padding: 10px 16px;
            border-radius: 8px; background: var(--text-primary); color: white;
            font-size: 13px; z-index: 1000; opacity: 0; transform: translateY(-10px);
            transition: all 0.2s; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: var(--danger-color); }
        .toast.success { background: var(--success-color); }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="top-bar">
            <div>
                <a href="cases.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> 返回案件列表
                </a>
                <div class="page-header">
                    <h1 class="page-title">我的提示词</h1>
                    <p class="page-subtitle">维护个人提示词；文书生成时与系统/管理后台提示词合并展示</p>
                </div>
            </div>
            <div class="business-switch" id="businessSwitch">
                <button class="business-switch-btn active" data-type="court" onclick="switchBusiness('court')">法院</button>
                <button class="business-switch-btn" data-type="procuratorate" onclick="switchBusiness('procuratorate')">检察院</button>
                <button class="business-switch-btn" data-type="justice" onclick="switchBusiness('justice')">司法局</button>
            </div>
        </div>

        <div class="main-layout">
            <div class="left-sidebar">
                <div class="sidebar-header">文书类型</div>
                <div class="left-list" id="leftList"></div>
            </div>
            <div class="content-area">
                <div class="content-header">
                    <span class="content-title" id="contentTitle">全部我的提示词</span>
                    <button class="btn btn-primary" onclick="openAddForm()">
                        <i class="fas fa-plus"></i> 新增提示词
                    </button>
                </div>
                <div class="item-list" id="itemList"></div>
                <div class="empty-state" id="emptyState" style="display:none;">
                    <i class="fas fa-tags"></i>
                    <p>暂无自定义提示词</p>
                    <p class="hint">点击「新增提示词」创建；文书生成时仍可使用系统内置提示词</p>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../js/case-data.js?v=54"></script>
    <script src="../js/my-prompts.js?v=1"></script>
</body>
</html>
