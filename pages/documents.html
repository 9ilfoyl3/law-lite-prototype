<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文书管理 - AI辅助办案系统</title>
    <link href="../libs/font-awesome-all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
    <style>
        /* Documents Page Styles */
        .documents-page {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .page-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn-primary {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--accent-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn-primary:hover {
            background: #1d4ed8;
        }

        .action-btn-secondary {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn-secondary:hover {
            background: var(--bg-primary);
        }

        /* Template Section */
        .template-section {
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--accent-primary);
        }

        .section-count {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .template-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .template-card:hover {
            border-color: var(--accent-primary);
            box-shadow: var(--hover-shadow);
            transform: translateY(-2px);
        }

        .template-icon {
            width: 48px;
            height: 48px;
            background: var(--accent-light);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 20px;
            color: var(--accent-primary);
        }

        .template-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .template-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .template-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .template-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .template-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .template-badge.public {
            background: #dbeafe;
            color: #2563eb;
        }

        .template-badge.personal {
            background: #fce7f3;
            color: #db2777;
        }

        /* Document List Section */
        .document-list-section {
            margin-top: 40px;
        }

        .filter-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .search-box {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 42px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: all 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .filter-select {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        /* Document List */
        .document-list {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }

        .document-list-header {
            display: grid;
            grid-template-columns: 2fr 120px 120px 150px 100px;
            gap: 16px;
            padding: 16px 24px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .document-item {
            display: grid;
            grid-template-columns: 2fr 120px 120px 150px 100px;
            gap: 16px;
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            transition: background 0.15s;
        }

        .document-item:last-child {
            border-bottom: none;
        }

        .document-item:hover {
            background: var(--bg-primary);
        }

        .document-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .document-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .document-icon.pdf { background: #fef2f2; color: #dc2626; }
        .document-icon.doc { background: #eff6ff; color: #2563eb; }

        .document-name-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .document-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .document-case {
            font-size: 12px;
            color: var(--text-muted);
        }

        .document-type,
        .document-size,
        .document-date {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .document-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .document-action-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .document-action-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        /* Empty State */
        .empty-state {
            padding: 80px 20px;
            text-align: center;
        }

        .empty-icon {
            width: 96px;
            height: 96px;
            margin: 0 auto 24px;
            background: var(--bg-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--text-muted);
        }

        .empty-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .empty-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .document-list-header,
            .document-item {
                grid-template-columns: 2fr 1fr 100px;
            }
            
            .document-list-header > :nth-child(3),
            .document-item > :nth-child(4) {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .template-grid {
                grid-template-columns: 1fr;
            }
            
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                max-width: none;
            }
            
            .document-list-header,
            .document-item {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            
            .document-list-header {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sidebar-logo">
            <i class="fas fa-cube"></i>
        </div>
        <div class="nav-items">
            <a href="chat.html" class="nav-item">
                <i class="fas fa-comments"></i>
                <span>聊天</span>
            </a>
            <a href="tasks.html" class="nav-item">
                <i class="fas fa-list-check"></i>
                <span>全部</span>
            </a>
            <a href="cases.html" class="nav-item">
                <i class="fas fa-folder"></i>
                <span>案件</span>
            </a>
            <a href="documents.html" class="nav-item active">
                <i class="fas fa-file-signature"></i>
                <span>文书</span>
            </a>
            <a href="knowledge.html" class="nav-item">
                <i class="fas fa-book"></i>
                <span>知识库</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span style="font-size: 16px; font-weight: 500; color: var(--text-primary);">文书管理</span>
            </div>
            <div class="user-menu" id="userMenu" style="position: relative;">
                <div class="user-avatar" onclick="toggleUserDropdown()" style="cursor: pointer;">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-dropdown" id="userDropdown">
                    <button class="user-dropdown-item logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>退出登录</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Documents Page Content -->
        <div class="documents-page">
            <!-- Page Header -->
            <div class="page-header">
                <h1 class="page-title">文书示例与文书</h1>
                <div class="page-actions">
                    <!--button class="action-btn-secondary">
                        <i class="fas fa-upload"></i>
                        上传文档
                    </button-->
                    <a href="chat.html" class="action-btn-primary" style="text-decoration: none;">
                        <i class="fas fa-plus"></i>
                        新建文书
                    </a>
                </div>
            </div>

            <!-- Templates Section -->
            <div class="template-section">
                <div class="section-header">
                    <div class="section-title">
                        <i class="fas fa-file-alt"></i>
                        常用示例
                        <span class="section-count">6个</span>
                    </div>
                </div>
                <div class="template-grid">
                    <div class="template-card" onclick="useTemplate('judgment')">
                        <span class="template-badge public">
                            <i class="fas fa-globe"></i>公共示例
                        </span>
                        <div class="template-icon">
                            <i class="fas fa-gavel"></i>
                        </div>
                        <div class="template-title">民事判决书</div>
                        <div class="template-desc">一审普通程序民事判决书标准示例</div>
                        <div class="template-meta">
                            <div class="template-meta-item">
                                <i class="fas fa-file-word"></i>
                                .docx
                            </div>
                            <div class="template-meta-item">
                                <i class="fas fa-download"></i>
                                2.3k
                            </div>
                        </div>
                    </div>
                    <div class="template-card" onclick="useTemplate('ruling')">
                        <span class="template-badge public">
                            <i class="fas fa-globe"></i>公共示例
                        </span>
                        <div class="template-icon">
                            <i class="fas fa-file-signature"></i>
                        </div>
                        <div class="template-title">民事裁定书</div>
                        <div class="template-desc">各类民事裁定书标准示例</div>
                        <div class="template-meta">
                            <div class="template-meta-item">
                                <i class="fas fa-file-word"></i>
                                .docx
                            </div>
                            <div class="template-meta-item">
                                <i class="fas fa-download"></i>
                                1.8k
                            </div>
                        </div>
                    </div>
                    <div class="template-card" onclick="useTemplate('mediation')">
                        <span class="template-badge public">
                            <i class="fas fa-globe"></i>公共示例
                        </span>
                        <div class="template-icon">
                            <i class="fas fa-handshake"></i>
                        </div>
                        <div class="template-title">民事调解书</div>
                        <div class="template-desc">民事调解书标准示例</div>
                        <div class="template-meta">
                            <div class="template-meta-item">
                                <i class="fas fa-file-word"></i>
                                .docx
                            </div>
                            <div class="template-meta-item">
                                <i class="fas fa-download"></i>
                                956
                            </div>
                        </div>
                    </div>
                    <div class="template-card" onclick="useTemplate('outline')">
                        <span class="template-badge personal">
                            <i class="fas fa-user"></i>我的示例
                        </span>
                        <div class="template-icon">
                            <i class="fas fa-list-alt"></i>
                        </div>
                        <div class="template-title">庭审提纲</div>
                        <div class="template-desc">庭审审理提纲示例</div>
                        <div class="template-meta">
                            <div class="template-meta-item">
                                <i class="fas fa-file-word"></i>
                                .docx
                            </div>
                            <div class="template-meta-item">
                                <i class="fas fa-download"></i>
                                1.2k
                            </div>
                        </div>
                    </div>
                    <div class="template-card" onclick="useTemplate('focus')">
                        <span class="template-badge personal">
                            <i class="fas fa-user"></i>我的示例
                        </span>
                        <div class="template-icon">
                            <i class="fas fa-crosshairs"></i>
                        </div>
                        <div class="template-title">争议焦点</div>
                        <div class="template-desc">争议焦点归纳分析示例</div>
                        <div class="template-meta">
                            <div class="template-meta-item">
                                <i class="fas fa-file-word"></i>
                                .docx
                            </div>
                            <div class="template-meta-item">
                                <i class="fas fa-download"></i>
                                876
                            </div>
                        </div>
                    </div>
                    <div class="template-card" onclick="useTemplate('notice')">
                        <span class="template-badge personal">
                            <i class="fas fa-user"></i>我的示例
                        </span>
                        <div class="template-icon">
                            <i class="fas fa-bell"></i>
                        </div>
                        <div class="template-title">开庭通知书</div>
                        <div class="template-desc">开庭通知书标准示例</div>
                        <div class="template-meta">
                            <div class="template-meta-item">
                                <i class="fas fa-file-word"></i>
                                .docx
                            </div>
                            <div class="template-meta-item">
                                <i class="fas fa-download"></i>
                                2.1k
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Document List Section -->
            <div class="document-list-section">
                <div class="section-header">
                    <div class="section-title">
                        <i class="fas fa-folder-open"></i>
                        我的文书
                        <span class="section-count">12个</span>
                    </div>
                </div>

                <!-- Filter Bar -->
                <div class="filter-bar">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="搜索文书名称……" id="docSearchInput">
                    </div>
                    <div class="filter-group">
                        <span class="filter-label">任务类型：</span>
                        <select class="filter-select" id="taskFilter">
                            <option value="">全部</option>
                            <option value="judgment">裁判文书</option>
                            <option value="ruling">裁定书</option>
                            <option value="mediation">调解书</option>
                            <option value="outline">庭审提纲</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <span class="filter-label">文档类型：</span>
                        <select class="filter-select" id="typeFilter">
                            <option value="">全部</option>
                            <option value="pdf">PDF</option>
                            <option value="doc">Word</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <span class="filter-label">排序：</span>
                        <select class="filter-select" id="sortFilter">
                            <option value="date">最近修改</option>
                            <option value="name">名称</option>
                            <option value="size">大小</option>
                        </select>
                    </div>
                </div>

                <!-- Document List -->
                <div class="document-list">
                    <div class="document-list-header">
                        <span>文书名称</span>
                        <span>类型</span>
                        <span>大小</span>
                        <span>修改时间</span>
                        <span>操作</span>
                    </div>
                    <div id="documentListBody">
                        <!-- Document items will be rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/documents.js"></script>
    <script>
        // 切换用户下拉菜单
        function toggleUserDropdown() {
            document.getElementById('userDropdown').classList.toggle('show');
        }

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                window.location.href = '../index.html';
            }
        }

        // 点击外部关闭下拉菜单
        document.addEventListener('click', function(e) {
            const userMenu = document.getElementById('userMenu');
            if (userMenu && !userMenu.contains(e.target)) {
                document.getElementById('userDropdown').classList.remove('show');
            }
        });
    </script>
</body>
</html>
