<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>10 · 文书精修闭环图（V1.1）</title>
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    --text: #1f2937;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --surface: #ffffff;
    --surface-muted: #f9fafb;
    --brand: #6d5ce7;
    --brand-soft: #f0edff;
    --warn: #d4a017;
    --warn-soft: #fdf6e3;
    --info: #2563eb;
    --info-soft: #dbeafe;
    --danger: #e74c3c;
    --radius-card: 12px;
    --spacer-8: 8px;
    --spacer-12: 12px;
    --spacer-16: 16px;
    --spacer-20: 20px;
    --spacer-24: 24px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: #f3f4f6;
    font-family: var(--font-sans);
    color: var(--text);
  }
  .widget-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: var(--spacer-24);
    max-width: 1080px;
    margin: 0 auto;
  }
  .widget-title { font-size: 18px; font-weight: 600; margin: 0 0 var(--spacer-8); }
  .widget-sub { font-size: 13px; color: var(--text-muted); margin: 0 0 var(--spacer-16); line-height: 1.6; }
  .svg-wrap { width: 100%; }
  .legend {
    display: flex; gap: var(--spacer-16);
    margin-top: var(--spacer-12);
    font-size: 12px; color: var(--text-muted);
    flex-wrap: wrap;
  }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .legend-line { width: 18px; height: 2px; display: inline-block; }
</style>
</head>
<body>
<div class="widget-card">
  <div class="widget-title">文书精修闭环图（V1.1）</div>
  <div class="widget-sub">独立页 document-polish.html 对话式精修；左文书展示 + 右对话面板；每轮修改保存为新版本不覆盖原文；可一键回退到任意历史版本</div>
  <div class="svg-wrap">
  <svg viewBox="0 0 1080 900" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrowFlow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="#6b7280" />
      </marker>
      <marker id="arrowBrand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="#6d5ce7" />
      </marker>
      <marker id="arrowWarn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="#d4a017" />
      </marker>
      <marker id="arrowLoop" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="#9ca3af" />
      </marker>
      <marker id="arrowInfo" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="#2563eb" />
      </marker>
      <marker id="arrowDanger" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="#e74c3c" />
      </marker>
    </defs>

    <!-- ===== Section 1: 入口 ===== -->
    <!-- 入口A: cases.html 历史文书列表 -->
    <g>
      <rect x="80" y="20" width="240" height="48" rx="24" fill="#6d5ce7" stroke="#6d5ce7"/>
      <text x="200" y="50" text-anchor="middle" fill="#ffffff" font-size="14">入口A · 案件列表页</text>
    </g>
    <text x="200" y="86" text-anchor="middle" fill="#6b7280" font-size="11">cases.html 操作栏「更多」→「历史文书」</text>

    <!-- 入口B: case-files.html 文书版本 -->
    <g>
      <rect x="760" y="20" width="240" height="48" rx="24" fill="#6d5ce7" stroke="#6d5ce7"/>
      <text x="880" y="50" text-anchor="middle" fill="#ffffff" font-size="14">入口B · 案件详情页</text>
    </g>
    <text x="880" y="86" text-anchor="middle" fill="#6b7280" font-size="11">case-files.html 文书版本列表</text>

    <!-- 汇流到「精修」按钮 -->
    <path d="M 200 92 L 200 116 L 380 138" stroke="#6d5ce7" stroke-width="2" fill="none"/>
    <path d="M 880 92 L 880 116 L 700 138" stroke="#6d5ce7" stroke-width="2" fill="none"/>

    <!-- 「精修」按钮（汇流点） -->
    <g>
      <rect x="380" y="116" width="320" height="44" rx="22" fill="#f0edff" stroke="#6d5ce7" stroke-width="2"/>
      <text x="540" y="143" text-anchor="middle" fill="#6d5ce7" font-size="14" font-weight="600">点击「精修」按钮</text>
    </g>

    <!-- 新标签页打开 -->
    <path d="M 540 160 L 540 184" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>
    <g>
      <rect x="340" y="188" width="400" height="40" rx="8" fill="#f9fafb" stroke="#6d5ce7" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="540" y="213" text-anchor="middle" fill="#1f2937" font-size="12">新标签页打开 document-polish.html</text>
    </g>
    <text x="760" y="213" fill="#6b7280" font-size="11">URL: caseId + versionId</text>

    <!-- ===== Section 2: 页面布局 ===== -->
    <path d="M 540 228 L 540 252" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>

    <!-- document-polish.html 容器 -->
    <g>
      <rect x="60" y="256" width="960" height="156" rx="10" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
      <text x="80" y="280" fill="#1f2937" font-size="14" font-weight="600">document-polish.html · 精修页面布局</text>

      <!-- 顶部版本信息条 -->
      <rect x="80" y="290" width="920" height="30" rx="6" fill="#f0edff" stroke="#6d5ce7" stroke-width="1"/>
      <text x="92" y="309" fill="#6d5ce7" font-size="11" font-weight="600">顶部版本信息</text>
      <text x="180" y="309" fill="#1f2937" font-size="11">当前版本 v3</text>
      <text x="280" y="309" fill="#1f2937" font-size="11">· 生成时间 2026-07-30 14:30</text>
      <text x="490" y="309" fill="#1f2937" font-size="11">· 来源版本 v2（一步生成）</text>
      <text x="760" y="309" fill="#6b7280" font-size="11">· modelId 只读</text>

      <!-- 左侧：文书内容展示区 75% -->
      <rect x="80" y="328" width="680" height="74" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
      <text x="92" y="348" fill="#1f2937" font-size="12" font-weight="500">左侧 · 文书内容展示区（75% 宽）</text>
      <text x="92" y="366" fill="#6b7280" font-size="11">实时渲染流式输出内容 / 滚动浏览 / 段落定位高亮</text>
      <text x="92" y="382" fill="#6b7280" font-size="11">输出完成后展示格式化文书</text>
      <text x="92" y="396" fill="#d4a017" font-size="11">流式输出过程中不可编辑</text>

      <!-- 右侧：对话式精修面板 25% -->
      <rect x="772" y="328" width="228" height="74" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
      <text x="886" y="348" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="500">右侧 · 对话精修面板（25%）</text>
      <text x="886" y="366" text-anchor="middle" fill="#6b7280" font-size="11">多轮对话指令输入 / 历史</text>
      <text x="886" y="382" text-anchor="middle" fill="#6b7280" font-size="11">「发送」「撤销」「完成」</text>
      <text x="886" y="396" text-anchor="middle" fill="#6b7280" font-size="11">结合上下文调用大模型</text>
    </g>

    <!-- ===== Section 3: 精修流程循环 ===== -->
    <path d="M 540 412 L 540 436" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>

    <!-- 循环节点 ① 用户输入修改指令 -->
    <g>
      <rect x="380" y="440" width="320" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
      <text x="540" y="463" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500">① 用户输入修改指令</text>
      <text x="540" y="481" text-anchor="middle" fill="#6b7280" font-size="11">如「把第三段改简洁些」「补充争议焦点」</text>
    </g>

    <path d="M 540 494 L 540 516" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>

    <!-- ② 调用 workflow -->
    <g>
      <rect x="320" y="520" width="440" height="60" rx="8" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
      <text x="540" y="543" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500">② 调用 Workflow（端到端 API）</text>
      <text x="540" y="561" text-anchor="middle" fill="#6b7280" font-size="11">携带：文书上下文 content + 修改指令 + 模板/提示词</text>
      <text x="540" y="575" text-anchor="middle" fill="#6b7280" font-size="11">modelId 由 workflow 决定，前端只读</text>
    </g>

    <path d="M 540 580 L 540 600" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>

    <!-- ③ 流式输出 + 实时更新 -->
    <g>
      <rect x="320" y="604" width="440" height="60" rx="8" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
      <text x="540" y="627" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500">③ 流式输出 → 左侧文书区实时更新</text>
      <text x="540" y="645" text-anchor="middle" fill="#6b7280" font-size="11">专用渲染区实时展示，分段进度提示</text>
      <text x="540" y="659" text-anchor="middle" fill="#6b7280" font-size="11">输出完成 → 自动渲染格式化文书</text>
    </g>

    <path d="M 540 664 L 540 686" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>

    <!-- ④ 保存为新版本（每轮） -->
    <g>
      <rect x="320" y="690" width="440" height="56" rx="8" fill="#f0edff" stroke="#6d5ce7" stroke-width="2"/>
      <text x="540" y="713" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500">④ 本轮修改保存为新版本（不覆盖原文）</text>
      <text x="540" y="731" text-anchor="middle" fill="#6b7280" font-size="11">追加到版本列表顶部 · source = polish · 可撤销</text>
    </g>

    <!-- 循环回环：继续修改下一轮 -->
    <path d="M 760 718 L 880 718 L 880 467 L 700 467" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowLoop)"/>
    <rect x="828" y="585" width="104" height="22" rx="11" fill="#ffffff" stroke="#9ca3af"/>
    <text x="880" y="600" text-anchor="middle" fill="#6b7280" font-size="11">继续修改下一轮</text>

    <!-- 撤销回环：回到上一版本 -->
    <path d="M 320 718 L 200 718 L 200 467 L 380 467" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowInfo)"/>
    <rect x="148" y="585" width="104" height="22" rx="11" fill="#ffffff" stroke="#2563eb"/>
    <text x="200" y="600" text-anchor="middle" fill="#2563eb" font-size="11">撤销回上一版本</text>

    <!-- 异常分支：workflow 失败 -->
    <path d="M 540 580 L 540 588 L 60 588 L 60 690" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowWarn)"/>
    <g>
      <rect x="40" y="694" width="220" height="56" rx="8" fill="#fdf6e3" stroke="#d4a017" stroke-width="1.5"/>
      <text x="150" y="716" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="500">异常：workflow 返回失败</text>
      <text x="150" y="734" text-anchor="middle" fill="#6b7280" font-size="11">提示「精修失败，请重试或调整指令」</text>
      <text x="150" y="748" text-anchor="middle" fill="#6b7280" font-size="11">不保存版本，停留在当前内容</text>
    </g>

    <!-- ===== Section 4: 版本管理 ===== -->
    <path d="M 540 746 L 540 770" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>

    <g>
      <rect x="60" y="774" width="960" height="80" rx="10" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
      <text x="80" y="796" fill="#1f2937" font-size="13" font-weight="600">版本管理 · 每轮修改保存为新版本（按 createdAt 倒序）</text>

      <!-- 版本列表 -->
      <rect x="80" y="804" width="280" height="44" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
      <text x="92" y="822" fill="#1f2937" font-size="11" font-weight="500">版本列表（倒序）</text>
      <text x="92" y="838" fill="#6d5ce7" font-size="11">v5 精修 · v4 精修 · v3 一步（来源）</text>
      <text x="92" y="848" fill="#6b7280" font-size="10">每轮修改追加，不覆盖已有版本</text>

      <!-- 数据结构字段 -->
      <rect x="376" y="804" width="380" height="44" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
      <text x="388" y="822" fill="#1f2937" font-size="11" font-weight="500">版本数据结构字段</text>
      <text x="388" y="836" fill="#6b7280" font-size="10">versionId · docType · templateId · promptText · modelId</text>
      <text x="388" y="846" fill="#6b7280" font-size="10">genMethod · source · createdBy · config · materialSnapshot · content</text>

      <!-- 一键回退 -->
      <rect x="772" y="804" width="228" height="44" rx="6" fill="#f0edff" stroke="#6d5ce7" stroke-width="1.5"/>
      <text x="886" y="822" text-anchor="middle" fill="#6d5ce7" font-size="11" font-weight="500">一键回退到任意历史版本</text>
      <text x="886" y="838" text-anchor="middle" fill="#6b7280" font-size="10">选中版本 → 加载到左侧展示区</text>
      <text x="886" y="848" text-anchor="middle" fill="#d4a017" font-size="10">作为新一轮精修起点 · 不删除任何版本</text>
    </g>

    <!-- V1.1 调整点标注 3 -->
    <g>
      <rect x="820" y="760" width="220" height="20" rx="10" fill="#fdf6e3" stroke="#d4a017"/>
      <text x="930" y="774" text-anchor="middle" fill="#d4a017" font-size="11">V1.1：source 字段标记精修来源</text>
    </g>

    <!-- ===== Section 5: 结束/退出 ===== -->
    <path d="M 540 854 L 540 870" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>

    <g>
      <rect x="80" y="870" width="920" height="28" rx="8" fill="#6d5ce7" stroke="#6d5ce7"/>
      <text x="220" y="889" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="500">① 保存当前精修结果为新版本</text>
      <text x="540" y="889" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="500">② 关闭标签页</text>
      <text x="860" y="889" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="500">③ 原页面文书徽章数 +1</text>
    </g>
  </svg>
  </div>
  <div class="legend">
    <span class="legend-item"><span class="legend-line" style="background:#6d5ce7"></span>主路径 / 精修流程</span>
    <span class="legend-item"><span class="legend-line" style="background:#2563eb"></span>对话精修 / 撤销回环</span>
    <span class="legend-item"><span class="legend-line" style="background:#9ca3af;border-top:1px dashed #9ca3af"></span>继续修改下一轮</span>
    <span class="legend-item"><span class="legend-line" style="background:#d4a017;border-top:1px dashed #d4a017"></span>异常 / 警告</span>
    <span class="legend-item"><span class="legend-dot" style="background:#f0edff;border:1px solid #6d5ce7"></span>新版本 / 高亮</span>
    <span class="legend-item"><span class="legend-dot" style="background:#dbeafe;border:1px solid #2563eb"></span>对话精修节点</span>
    <span class="legend-item"><span class="legend-dot" style="background:#fdf6e3;border:1px solid #d4a017"></span>V1.1 调整点</span>
  </div>
</div>
</body>
</html>
