<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>09 · 批量生成闭环图（V1.1）</title>
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    --text: #1f2937;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --surface: #ffffff;
    --surface-muted: #f9fafb;
    --brand: #6d5ce7;
    --brand-soft: #ede9fe;
    --warn: #d4a017;
    --warn-bg: #fdf6e3;
    --danger: #e74c3c;
    --danger-bg: #fef2f2;
    --radius-card: 12px;
    --spacer-8: 8px;
    --spacer-12: 12px;
    --spacer-16: 16px;
    --spacer-20: 20px;
  }
  body { margin: 0; padding: 24px; background: #f3f4f6; font-family: var(--font-sans); color: var(--text); }
  .widget-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: var(--spacer-20); max-width: 1080px; margin: 0 auto; }
  .widget-title { font-size: 18px; font-weight: 600; margin: 0 0 var(--spacer-8); }
  .widget-sub { font-size: 13px; color: var(--text-muted); margin: 0 0 var(--spacer-16); }
  .svg-wrap { width: 100%; }
  .legend { display: flex; gap: var(--spacer-16); margin-top: var(--spacer-12); font-size: 12px; color: var(--text-muted); flex-wrap: wrap; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>
<div class="widget-card">
  <div class="widget-title">批量生成闭环图（V1.1）</div>
  <div class="widget-sub">案件列表页多选 → 统一配置弹框 → 异步队列逐案件调 workflow；配置阶段前置异常告知，单案件超限不阻断队列</div>
  <div class="svg-wrap">
  <svg viewBox="0 0 1080 1100" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrowFlow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="#6b7280" />
      </marker>
      <marker id="arrowBrand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="#6d5ce7" />
      </marker>
      <marker id="arrowWarn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="#d4a017" />
      </marker>
      <marker id="arrowDanger" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="#e74c3c" />
      </marker>
      <marker id="arrowLoop" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="#9ca3af" />
      </marker>
    </defs>

    <!-- ============ 1. 入口 ============ -->
    <g>
      <rect x="390" y="24" width="300" height="44" rx="22" fill="#6d5ce7" stroke="#6d5ce7"/>
      <text x="540" y="51" text-anchor="middle" fill="#ffffff" font-size="14">入口 · 案件列表页 cases.html</text>
    </g>
    <text x="540" y="84" text-anchor="middle" fill="#6b7280" font-size="11">多选案件 → 点击「批量生成」按钮触发</text>
    <path d="M 540 90 L 540 100" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>

    <!-- ============ 2. 配置阶段弹框 ============ -->
    <g>
      <rect x="80" y="104" width="920" height="184" rx="8" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
      <text x="100" y="128" fill="#1f2937" font-size="14" font-weight="600">配置阶段弹框（cases.js 批量生成配置）</text>
      <text x="100" y="146" fill="#6b7280" font-size="11">统一一种文书类型 + 模板/文书要求批量共用；modelId 写入版本快照（用户侧不展示模型）</text>
      <!-- V1.1 徽章 -->
      <rect x="868" y="114" width="112" height="22" rx="11" fill="#ede9fe" stroke="#6d5ce7"/>
      <text x="924" y="129" text-anchor="middle" fill="#6d5ce7" font-size="11" font-weight="500">V1.1 调整点</text>

      <!-- 配置项 1：文书类型 -->
      <rect x="96" y="160" width="168" height="118" rx="6" fill="#f9fafb" stroke="#6d5ce7"/>
      <text x="180" y="184" text-anchor="middle" fill="#6d5ce7" font-size="12" font-weight="500">文书类型</text>
      <text x="180" y="204" text-anchor="middle" fill="#6b7280" font-size="10">统一一种 · 下拉选择</text>
      <text x="180" y="220" text-anchor="middle" fill="#6b7280" font-size="10">决定可用 Workflow</text>
      <text x="180" y="236" text-anchor="middle" fill="#6b7280" font-size="10">批量共用同一类型</text>
      <text x="180" y="258" text-anchor="middle" fill="#6d5ce7" font-size="9">V1.1：统一一种</text>

      <!-- 配置项 2：文书模板 -->
      <rect x="276" y="160" width="168" height="118" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
      <text x="360" y="184" text-anchor="middle" fill="#6d5ce7" font-size="12" font-weight="500">文书模板</text>
      <text x="360" y="204" text-anchor="middle" fill="#6b7280" font-size="10">optgroup 分组</text>
      <text x="360" y="220" text-anchor="middle" fill="#6b7280" font-size="10">标准模板 + 我的模板</text>
      <text x="360" y="236" text-anchor="middle" fill="#6b7280" font-size="10">批量共用模板</text>
      <text x="360" y="258" text-anchor="middle" fill="#6b7280" font-size="9">下拉选择</text>

      <!-- 配置项 3：文书要求 -->
      <rect x="456" y="160" width="168" height="118" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
      <text x="540" y="184" text-anchor="middle" fill="#6d5ce7" font-size="12" font-weight="500">文书要求</text>
      <text x="540" y="204" text-anchor="middle" fill="#6b7280" font-size="10">标准文书要求 + 我的文书要求</text>
      <text x="540" y="220" text-anchor="middle" fill="#6b7280" font-size="10">颜色区分来源</text>
      <text x="540" y="236" text-anchor="middle" fill="#6b7280" font-size="10">启用 / 停用切换</text>
      <text x="540" y="258" text-anchor="middle" fill="#6b7280" font-size="9">批量共用</text>

      <!-- 配置项 4：模型字段（V1.1 已移除） -->
      <rect x="636" y="160" width="168" height="118" rx="6" fill="#fef2f2" stroke="#e74c3c" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="720" y="184" text-anchor="middle" fill="#e74c3c" font-size="12" font-weight="500">模型字段（已移除）</text>
      <text x="720" y="204" text-anchor="middle" fill="#6b7280" font-size="10">V1.1：用户侧不展示</text>
      <text x="720" y="220" text-anchor="middle" fill="#6b7280" font-size="10">由 workflow 决定</text>
      <text x="720" y="236" text-anchor="middle" fill="#6b7280" font-size="10">modelId 写入版本快照</text>
      <text x="720" y="258" text-anchor="middle" fill="#9ca3af" font-size="9">仅供留痕</text>

      <!-- 配置项 5：要件 -->
      <rect x="816" y="160" width="168" height="118" rx="6" fill="#fdf6e3" stroke="#d4a017"/>
      <text x="900" y="184" text-anchor="middle" fill="#d4a017" font-size="12" font-weight="500">要件（可选 Plus）</text>
      <text x="900" y="204" text-anchor="middle" fill="#6b7280" font-size="10">0 个或多个</text>
      <text x="900" y="220" text-anchor="middle" fill="#6b7280" font-size="10">仅判决书 + 案字过滤</text>
      <text x="900" y="236" text-anchor="middle" fill="#6b7280" font-size="10">可选填充</text>
      <text x="900" y="258" text-anchor="middle" fill="#d4a017" font-size="9">可选 · 不阻断</text>
    </g>
    <path d="M 540 290 L 540 300" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>

    <!-- ============ 3. 配置阶段异常告知（V1.1 关键） ============ -->
    <g>
      <rect x="80" y="304" width="920" height="124" rx="8" fill="#fdf6e3" stroke="#d4a017" stroke-width="1.5"/>
      <text x="100" y="328" fill="#1f2937" font-size="14" font-weight="600">配置阶段异常告知</text>
      <rect x="262" y="312" width="116" height="22" rx="11" fill="#d4a017" stroke="#d4a017"/>
      <text x="320" y="327" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="500">V1.1 关键</text>
      <text x="388" y="328" fill="#6b7280" font-size="11">提交前在弹框内前置暴露，不让用户进入执行后才发现</text>

      <!-- 异常告知 1：解析异常案件徽章 -->
      <rect x="100" y="346" width="276" height="74" rx="6" fill="#ffffff" stroke="#d4a017"/>
      <text x="238" y="368" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="500">解析异常案件 · 黄色徽章</text>
      <text x="238" y="386" text-anchor="middle" fill="#6b7280" font-size="10">案件解析失败 / 材料缺失</text>
      <text x="238" y="402" text-anchor="middle" fill="#6b7280" font-size="10">选中列表中案件标黄色徽章</text>
      <text x="238" y="416" text-anchor="middle" fill="#d4a017" font-size="10">点击徽章 → 查看异常原因</text>

      <!-- 异常告知 2：策略选项 -->
      <rect x="386" y="346" width="308" height="74" rx="6" fill="#ffffff" stroke="#d4a017"/>
      <text x="540" y="368" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="500">策略选项（二选一）</text>
      <text x="540" y="386" text-anchor="middle" fill="#6b7280" font-size="10">① 跳过异常案件（不入队列）</text>
      <text x="540" y="402" text-anchor="middle" fill="#6b7280" font-size="10">② 仅用已识别材料生成</text>
      <text x="540" y="416" text-anchor="middle" fill="#d4a017" font-size="10">用户选择后写入队列配置</text>

      <!-- 异常告知 3：队列满阻止提交 -->
      <rect x="704" y="346" width="276" height="74" rx="6" fill="#ffffff" stroke="#e74c3c"/>
      <text x="842" y="368" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="500">队列满 · 阻止提交</text>
      <text x="842" y="386" text-anchor="middle" fill="#6b7280" font-size="10">队列满时禁用「提交」按钮</text>
      <text x="842" y="402" text-anchor="middle" fill="#6b7280" font-size="10">提示剩余可用位置数</text>
      <text x="842" y="416" text-anchor="middle" fill="#e74c3c" font-size="10">需移出案件后才能提交</text>
    </g>
    <path d="M 540 430 L 540 440" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>

    <!-- ============ 4. 执行阶段（异步队列） ============ -->
    <g>
      <rect x="80" y="444" width="920" height="158" rx="8" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
      <text x="100" y="468" fill="#1f2937" font-size="14" font-weight="600">执行阶段（异步队列）</text>
      <rect x="868" y="454" width="112" height="22" rx="11" fill="#ede9fe" stroke="#6d5ce7"/>
      <text x="924" y="469" text-anchor="middle" fill="#6d5ce7" font-size="11" font-weight="500">V1.1 调整点</text>

      <!-- 进度条 -->
      <rect x="100" y="484" width="820" height="14" rx="7" fill="#f3f4f6" stroke="#e5e7eb"/>
      <rect x="100" y="484" width="500" height="14" rx="7" fill="#6d5ce7"/>
      <text x="540" y="478" text-anchor="middle" fill="#6b7280" font-size="10">完成 12 / 30 · 当前：张三案</text>

      <!-- 2x2 网格 -->
      <rect x="100" y="510" width="400" height="40" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
      <text x="110" y="528" fill="#6d5ce7" font-size="11" font-weight="500">顶部「批量任务」入口</text>
      <text x="110" y="543" fill="#6b7280" font-size="10">队列清空后入口自动消失</text>

      <rect x="512" y="510" width="400" height="40" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
      <text x="522" y="528" fill="#6d5ce7" font-size="11" font-weight="500">异步队列逐案件调 workflow</text>
      <text x="522" y="543" fill="#6b7280" font-size="10">端到端 API · 后台串行执行</text>

      <rect x="100" y="556" width="400" height="40" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
      <text x="110" y="574" fill="#6d5ce7" font-size="11" font-weight="500">进度反馈：完成数 / 总数</text>
      <text x="110" y="589" fill="#6b7280" font-size="10">实时显示当前案件名</text>

      <rect x="512" y="556" width="400" height="40" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
      <text x="522" y="574" fill="#6d5ce7" font-size="11" font-weight="500">不阻塞用户其他操作</text>
      <text x="522" y="589" fill="#6b7280" font-size="10">后台执行 · 可继续浏览列表</text>
    </g>
    <path d="M 540 604 L 540 614" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>

    <!-- ============ 5. 逐案件 Workflow 调用 · 超限分支 ============ -->
    <g>
      <rect x="80" y="618" width="920" height="154" rx="8" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
      <text x="100" y="640" fill="#1f2937" font-size="14" font-weight="600">逐案件 Workflow 调用 · 超限分支（不阻断队列）</text>
      <rect x="868" y="628" width="112" height="22" rx="11" fill="#ede9fe" stroke="#6d5ce7"/>
      <text x="924" y="643" text-anchor="middle" fill="#6d5ce7" font-size="11" font-weight="500">V1.1 调整点</text>

      <!-- 队列循环回环箭头（顶部弧线） -->
      <path d="M 890 680 L 890 662 L 156 662 L 156 680" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowLoop)"/>
      <rect x="478" y="654" width="124" height="18" rx="9" fill="#ffffff" stroke="#9ca3af"/>
      <text x="540" y="667" text-anchor="middle" fill="#6b7280" font-size="10">↻ 队列循环 · 逐案件推进</text>

      <!-- 取出下一案件 -->
      <rect x="96" y="680" width="120" height="56" rx="6" fill="#f9fafb" stroke="#6d5ce7"/>
      <text x="156" y="704" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="500">取出下一案件</text>
      <text x="156" y="722" text-anchor="middle" fill="#6b7280" font-size="10">队列头部出队</text>
      <path d="M 216 708 L 240 708" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>

      <!-- 调用 Workflow -->
      <rect x="240" y="680" width="130" height="56" rx="6" fill="#f9fafb" stroke="#6d5ce7"/>
      <text x="305" y="704" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="500">调用 Workflow</text>
      <text x="305" y="722" text-anchor="middle" fill="#6b7280" font-size="10">端到端 API</text>
      <path d="M 370 708 L 380 708" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>

      <!-- 结果判断菱形 -->
      <path d="M 420 680 L 460 708 L 420 736 L 380 708 Z" fill="#f9fafb" stroke="#6d5ce7" stroke-width="2"/>
      <text x="420" y="704" text-anchor="middle" fill="#1f2937" font-size="11">结果</text>
      <text x="420" y="718" text-anchor="middle" fill="#1f2937" font-size="11">判断</text>

      <!-- 正常分支 -->
      <path d="M 460 708 L 480 708 L 480 690 L 500 690" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>
      <rect x="392" y="676" width="44" height="16" rx="8" fill="#ffffff" stroke="#6d5ce7"/>
      <text x="414" y="688" text-anchor="middle" fill="#6d5ce7" font-size="10">正常</text>
      <rect x="500" y="672" width="220" height="36" rx="6" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
      <text x="610" y="688" text-anchor="middle" fill="#6d5ce7" font-size="11" font-weight="500">标记 success · 累计完成数</text>
      <text x="610" y="702" text-anchor="middle" fill="#6b7280" font-size="10">正常输出文书片段</text>

      <!-- 超限分支 -->
      <path d="M 460 708 L 480 708 L 480 738 L 500 738" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowWarn)"/>
      <rect x="392" y="724" width="44" height="16" rx="8" fill="#ffffff" stroke="#d4a017"/>
      <text x="414" y="736" text-anchor="middle" fill="#d4a017" font-size="10">超限</text>
      <rect x="500" y="720" width="220" height="36" rx="6" fill="#fdf6e3" stroke="#d4a017" stroke-width="1.5"/>
      <text x="610" y="736" text-anchor="middle" fill="#d4a017" font-size="11" font-weight="500">标记 failed · 「进详情页查看」</text>
      <text x="610" y="750" text-anchor="middle" fill="#6b7280" font-size="10">单案件失败不影响其他案件</text>

      <!-- 汇流到 继续下一案件 -->
      <path d="M 720 690 L 740 690 L 740 704" stroke="#6d5ce7" stroke-width="2" fill="none"/>
      <path d="M 720 738 L 740 738 L 740 712" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>
      <rect x="740" y="680" width="150" height="56" rx="6" fill="#f9fafb" stroke="#9ca3af"/>
      <text x="815" y="704" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="500">继续下一案件</text>
      <text x="815" y="722" text-anchor="middle" fill="#6b7280" font-size="10">不阻断队列</text>

      <!-- 其他案件继续执行提示 -->
      <path d="M 890 708 L 900 708" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowLoop)"/>
      <rect x="900" y="688" width="92" height="40" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="3,3"/>
      <text x="946" y="706" text-anchor="middle" fill="#6b7280" font-size="10">其他案件</text>
      <text x="946" y="720" text-anchor="middle" fill="#6b7280" font-size="10">继续执行</text>
    </g>
    <path d="M 540 774 L 540 784" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>

    <!-- ============ 6. 结束状态 ============ -->
    <g>
      <!-- 全部成功 -->
      <rect x="80" y="788" width="440" height="78" rx="8" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
      <rect x="92" y="800" width="64" height="20" rx="10" fill="#6d5ce7"/>
      <text x="124" y="814" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="500">success</text>
      <text x="164" y="814" fill="#1f2937" font-size="13" font-weight="500">全部成功 · success 总数</text>
      <text x="100" y="834" fill="#6b7280" font-size="11">队列全部案件完成生成</text>
      <text x="100" y="850" fill="#6b7280" font-size="11">可点击「批量任务」入口查看汇总</text>
      <text x="510" y="824" text-anchor="end" fill="#6d5ce7" font-size="20" font-weight="600">✓</text>
    </g>

    <g>
      <!-- 部分失败 -->
      <rect x="560" y="788" width="440" height="78" rx="8" fill="#ffffff" stroke="#d4a017" stroke-width="2"/>
      <rect x="572" y="800" width="64" height="20" rx="10" fill="#d4a017"/>
      <text x="604" y="814" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="500">failed</text>
      <text x="644" y="814" fill="#1f2937" font-size="13" font-weight="500">部分失败 · failed 数 + 详情页入口</text>
      <text x="580" y="834" fill="#6b7280" font-size="11">failed 数 + 汇总失败案件列表</text>
      <text x="580" y="850" fill="#6b7280" font-size="11">「进详情页查看」按钮逐案件处理</text>
      <text x="990" y="824" text-anchor="end" fill="#d4a017" font-size="20" font-weight="600">!</text>
    </g>

    <!-- ============ 7. 结果明细页 ============ -->
    <path d="M 540 866 L 540 880" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>
    <g>
