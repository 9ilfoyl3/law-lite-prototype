<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>08 · 分步生成闭环图（V1.1）</title>
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    --text: #1f2937;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --surface: #ffffff;
    --surface-muted: #f9fafb;
    --brand: #6d5ce7;
    --warn: #d4a017;
    --info: #3b82f6;
    --info-bg: #eff6ff;
    --danger: #e74c3c;
    --danger-bg: #fef2f2;
    --radius-card: 12px;
    --spacer-8: 8px;
    --spacer-12: 12px;
    --spacer-16: 16px;
    --spacer-20: 20px;
  }
  body { margin: 0; padding: 24px; background: #f3f4f6; font-family: var(--font-sans); color: var(--text); }
  .widget-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: var(--spacer-20); max-width: 1200px; margin: 0 auto; }
  .widget-title { font-size: 18px; font-weight: 600; margin: 0 0 var(--spacer-8); }
  .widget-sub { font-size: 13px; color: var(--text-muted); margin: 0 0 var(--spacer-16); }
  .svg-wrap { width: 100%; }
  .legend { display: flex; gap: var(--spacer-16); margin-top: var(--spacer-12); font-size: 12px; color: var(--text-muted); flex-wrap: wrap; }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>
<div class="widget-card">
  <div class="widget-title">分步生成闭环图（V1.1）</div>
  <div class="widget-sub">仅判决书类型展示分步 Tab；按案件阶段判断步骤序列（一审5步/二审6步），手动逐步触发，全部完成后生成完整文书</div>
  <div class="svg-wrap">
  <svg viewBox="0 0 1180 920" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrowFlow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="#6b7280" />
      </marker>
      <marker id="arrowBrand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="#6d5ce7" />
      </marker>
      <marker id="arrowRequired" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="#e74c3c" />
      </marker>
      <marker id="arrowOptional" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M1 1 L7 4 L1 7 Z" fill="#3b82f6" />
      </marker>
    </defs>

    <!-- 前置条件 -->
    <g>
      <rect x="320" y="20" width="540" height="92" rx="8" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
      <text x="590" y="42" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="500">前置条件：updateStepsTabVisibility 判断</text>
      <text x="590" y="60" text-anchor="middle" fill="#6b7280" font-size="11">案件阶段决定步骤序列（有案字自动判定，无案字必选）</text>
      <text x="590" y="76" text-anchor="middle" fill="#6b7280" font-size="11">仅「判决书」类型展示分步生成 Tab</text>
      <text x="590" y="92" text-anchor="middle" fill="#6b7280" font-size="11">裁定书/调解书等只有一步生成 Tab</text>
    </g>
    <!-- case7 演示路径标注 -->
    <g>
      <rect x="900" y="20" width="260" height="92" rx="8" fill="#f0edff" stroke="#6d5ce7" stroke-width="1.5" stroke-dasharray="4,3"/>
      <text x="1030" y="42" text-anchor="middle" fill="#6d5ce7" font-size="12" font-weight="500">case7 演示路径</text>
      <text x="1030" y="60" text-anchor="middle" fill="#6b7280" font-size="10">一步生成超限（36 材料×6000）</text>
      <text x="1030" y="74" text-anchor="middle" fill="#6b7280" font-size="10">→ 弹框「切换至分步生成」</text>
      <text x="1030" y="88" text-anchor="middle" fill="#6b7280" font-size="10">→ 进入分步 Tab</text>
      <text x="1030" y="102" text-anchor="middle" fill="#d4a017" font-size="10">5 步序列正常执行</text>
    </g>
    <path d="M 900 66 L 860 66" stroke="#6d5ce7" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowBrand)"/>
    <path d="M 590 112 L 590 124" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>

    <!-- 步骤通用交互说明（左侧，含生成后操作 + 异常） -->
    <g>
      <rect x="20" y="130" width="240" height="410" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
      <text x="140" y="152" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500">每步通用交互（手动触发）</text>
      <text x="30" y="174" fill="#6b7280" font-size="11">1. 独立选材料（步骤级非全局）</text>
      <text x="30" y="192" fill="#6b7280" font-size="11">2. 配置模板</text>
      <text x="30" y="210" fill="#6b7280" font-size="11">3. 点击「生成」按钮触发</text>
      <text x="30" y="228" fill="#6b7280" font-size="11">4. 选完材料不自动触发</text>
      <text x="30" y="246" fill="#6b7280" font-size="11">5. 调用 workflow（端到端 API）</text>
      <text x="30" y="264" fill="#6b7280" font-size="11">6. 保留输出快照（可查看）</text>
      <text x="30" y="282" fill="#d4a017" font-size="11">注：每步独立 API 调用</text>

      <line x1="40" y1="296" x2="240" y2="296" stroke="#e5e7eb" stroke-width="1"/>
      <text x="140" y="316" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="500">生成后操作（当前步）</text>
      <text x="30" y="338" fill="#6d5ce7" font-size="11" font-weight="500">重新生成</text>
      <text x="30" y="354" fill="#6b7280" font-size="11">仅覆盖当前步输出</text>
      <text x="30" y="370" fill="#6b7280" font-size="11">不影响后续已完成步骤</text>
      <text x="30" y="386" fill="#d4a017" font-size="11">递归重置暂不实现</text>
      <text x="30" y="410" fill="#6d5ce7" font-size="11" font-weight="500">内容优化回填</text>
      <text x="30" y="426" fill="#6b7280" font-size="11">回填最近一次历史文书快照</text>
      <text x="30" y="442" fill="#6b7280" font-size="11">已选材料+类型/模板/方式</text>
      <text x="30" y="458" fill="#d4a017" font-size="11">stepsSnapshot 暂不回填</text>

      <line x1="40" y1="472" x2="240" y2="472" stroke="#e5e7eb" stroke-width="1"/>
      <text x="140" y="492" text-anchor="middle" fill="#1f2937" font-size="12" font-weight="500">异常处理</text>
      <text x="30" y="514" fill="#d4a017" font-size="11" font-weight="500">workflow 超限异常</text>
      <text x="30" y="530" fill="#6b7280" font-size="11">提示材料量过大请减少</text>
      <text x="30" y="546" fill="#6b7280" font-size="11">不阻止按钮，返回后展示</text>
    </g>

    <!-- 依赖提示条状态说明（右侧） -->
    <g>
      <rect x="920" y="130" width="240" height="180" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
      <text x="1040" y="152" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500">依赖提示条（buildStepDependencyHintHtml）</text>
      <rect x="935" y="164" width="14" height="14" rx="3" fill="#eff6ff" stroke="#3b82f6"/>
      <text x="955" y="175" fill="#6b7280" font-size="11">蓝色 info · 无依赖 / 前置已完成</text>
      <rect x="935" y="186" width="14" height="14" rx="3" fill="#fef2f2" stroke="#e74c3c"/>
      <text x="955" y="197" fill="#6b7280" font-size="11">红色 block · 必填未完成（按钮置灰）</text>
      <rect x="935" y="208" width="14" height="14" rx="3" fill="#fdf6e3" stroke="#d4a017"/>
      <text x="955" y="219" fill="#6b7280" font-size="11">黄色 warning · 选填未完成（可执行）</text>
      <text x="935" y="245" fill="#1f2937" font-size="11" font-weight="500">按钮可用性：</text>
      <text x="935" y="263" fill="#6b7280" font-size="11">必填依赖未完成 → 置灰 + title 提示</text>
      <text x="935" y="281" fill="#6b7280" font-size="11">选填依赖未完成 → 允许执行传空值</text>
      <text x="935" y="299" fill="#6b7280" font-size="11">超限异常 → 不阻止按钮，返回后展示</text>
    </g>

    <!-- 步骤1：原告诉请 -->
    <g>
      <rect x="320" y="130" width="540" height="80" rx="8" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
      <text x="340" y="154" fill="#6d5ce7" font-size="13" font-weight="600">步骤 1 · 原告诉请</text>
      <text x="340" y="174" fill="#6b7280" font-size="11">无前置依赖 → 蓝色 info 提示</text>
      <text x="340" y="190" fill="#6b7280" font-size="11">手动点击「生成」→ 调用 workflow → 输出本步内容</text>
      <text x="340" y="204" fill="#6b7280" font-size="11">保留输出快照，可查看 / 重新生成 / 内容优化回填</text>
      <rect x="730" y="142" width="120" height="22" rx="11" fill="#eff6ff" stroke="#3b82f6"/>
      <text x="790" y="157" text-anchor="middle" fill="#3b82f6" font-size="11">无依赖 · 可执行</text>
    </g>

    <!-- 步骤2：被告答辩 -->
    <path d="M 590 210 L 590 240" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrowFlow)"/>
    <g>
      <rect x="320" y="244" width="540" height="80" rx="8" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
      <text x="340" y="268" fill="#6d5ce7" font-size="13" font-weight="600">步骤 2 · 被告答辩</text>
      <text x="340" y="288" fill="#6b7280" font-size="11">无前置依赖 → 蓝色 info 提示</text>
      <text x="340" y="304" fill="#6b7280" font-size="11">手动点击「生成」→ 调用 workflow → 输出本步内容</text>
      <text x="340" y="318" fill="#6b7280" font-size="11">保留输出快照，可查看 / 重新生成 / 内容优化回填</text>
      <rect x="730" y="256" width="120" height="22" rx="11" fill="#eff6ff" stroke="#3b82f6"/>
      <text x="790" y="271" text-anchor="middle" fill="#3b82f6" font-size="11">无依赖 · 可执行</text>
    </g>

    <!-- 步骤3：争议焦点（可选依赖 1+2） -->
    <path d="M 590 324 L 590 354" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrowFlow)"/>

    <!-- 可选依赖箭头：1,2 → 3 -->
    <path d="M 320 170 L 280 170 L 280 388 L 320 388" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowOptional)"/>
    <path d="M 320 284 L 260 284 L 260 398 L 320 398" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowOptional)"/>
    <rect x="220" y="336" width="100" height="20" rx="10" fill="#ffffff" stroke="#3b82f6"/>
    <text x="270" y="350" text-anchor="middle" fill="#3b82f6" font-size="10">可选依赖 required=false</text>

    <g>
      <rect x="320" y="360" width="540" height="80" rx="8" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
      <text x="340" y="384" fill="#6d5ce7" font-size="13" font-weight="600">步骤 3 · 争议焦点</text>
      <text x="340" y="404" fill="#6b7280" font-size="11">可选依赖步骤 1+2 返回内容（required=false）</text>
      <text x="340" y="420" fill="#6b7280" font-size="11">为空允许执行传空值 → 输出本步内容</text>
      <text x="340" y="434" fill="#6b7280" font-size="11">已完成 1/2 → 蓝色 info；未完成 → 黄色 warning</text>
      <rect x="710" y="372" width="140" height="22" rx="11" fill="#fdf6e3" stroke="#d4a017"/>
      <text x="780" y="387" text-anchor="middle" fill="#d4a017" font-size="11">选填未完成 · 可执行</text>
    </g>

    <!-- 步骤4：事实认定（必填依赖 3） -->
    <path d="M 590 440 L 590 470" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrowFlow)"/>
    <path d="M 860 400 L 880 400 L 880 500 L 860 500" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrowRequired)"/>
    <rect x="820" y="440" width="120" height="20" rx="10" fill="#ffffff" stroke="#e74c3c"/>
    <text x="880" y="454" text-anchor="middle" fill="#e74c3c" font-size="10">必填依赖 required=true</text>

    <g>
      <rect x="320" y="474" width="540" height="80" rx="8" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
      <text x="340" y="498" fill="#6d5ce7" font-size="13" font-weight="600">步骤 4 · 事实认定</text>
      <text x="340" y="518" fill="#6b7280" font-size="11">必填依赖步骤 3 返回内容（required=true）</text>
      <text x="340" y="534" fill="#6b7280" font-size="11">为空阻止执行 → 输出本步内容</text>
      <text x="340" y="548" fill="#6b7280" font-size="11">未完成 → 红色 block + 按钮置灰 + title 提示</text>
      <rect x="710" y="486" width="140" height="22" rx="11" fill="#fef2f2" stroke="#e74c3c"/>
      <text x="780" y="501" text-anchor="middle" fill="#e74c3c" font-size="11">必填未完成 · 按钮置灰</text>
    </g>

    <!-- 步骤5：裁判结果（必填依赖 4） -->
    <path d="M 590 554 L 590 584" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrowFlow)"/>
    <path d="M 860 514 L 880 514 L 880 614 L 860 614" stroke="#e74c3c" stroke-width="2" fill="none" marker-end="url(#arrowRequired)"/>
    <rect x="820" y="554" width="120" height="20" rx="10" fill="#ffffff" stroke="#e74c3c"/>
    <text x="880" y="568" text-anchor="middle" fill="#e74c3c" font-size="10">必填依赖 required=true</text>

    <g>
      <rect x="320" y="588" width="540" height="80" rx="8" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
      <text x="340" y="612" fill="#6d5ce7" font-size="13" font-weight="600">步骤 5 · 裁判结果</text>
      <text x="340" y="632" fill="#6b7280" font-size="11">必填依赖步骤 4 返回内容（required=true）</text>
      <text x="340" y="648" fill="#6b7280" font-size="11">为空阻止执行 → 输出本步内容</text>
      <text x="340" y="662" fill="#6b7280" font-size="11">未完成 → 红色 block + 按钮置灰 + title 提示</text>
      <rect x="710" y="600" width="140" height="22" rx="11" fill="#fef2f2" stroke="#e74c3c"/>
      <text x="780" y="615" text-anchor="middle" fill="#e74c3c" font-size="11">必填未完成 · 按钮置灰</text>
    </g>

    <!-- 全部步骤完成 → 生成文书按钮 -->
    <path d="M 590 668 L 590 704" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>
    <g>
      <rect x="320" y="708" width="540" height="56" rx="8" fill="#6d5ce7" stroke="#6d5ce7"/>
      <text x="590" y="734" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="500">全部步骤完成 · 显示「生成文书」按钮</text>
      <text x="590" y="752" text-anchor="middle" fill="#ffffff" font-size="11">仅当全部步骤完成才显示</text>
    </g>

    <!-- 完整文书 -->
    <path d="M 590 764 L 590 794" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>
    <g>
      <rect x="320" y="798" width="540" height="60" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
      <text x="590" y="822" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500">完整文书</text>
      <text x="590" y="840" text-anchor="middle" fill="#6b7280" font-size="11">保存为文书版本（含 stepsSnapshot 步骤快照）</text>
      <text x="590" y="854" text-anchor="middle" fill="#6b7280" font-size="11">按 docType 合并 + 不覆盖已有版本</text>
    </g>

    <!-- 终点提示 -->
    <text x="590" y="892" text-anchor="middle" fill="#6d5ce7" font-size="12" font-weight="500">闭环完成 · 手动逐步触发 · 全部完成后生成完整文书</text>
  </svg>
  </div>
  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:#6d5ce7"></span>主路径 / 焦点</span>
    <span class="legend-item"><span class="legend-dot" style="background:#ffffff;border:1px solid #e5e7eb"></span>普通节点</span>
    <span class="legend-item"><span class="legend-dot" style="background:#eff6ff;border:1px solid #3b82f6"></span>蓝色 info · 无依赖 / 前置已完成</span>
    <span class="legend-item"><span class="legend-dot" style="background:#fef2f2;border:1px solid #e74c3c"></span>红色 block · 必填未完成</span>
    <span class="legend-item"><span class="legend-dot" style="background:#fdf6e3;border:1px solid #d4a017"></span>黄色 warning · 选填未完成</span>
    <span class="legend-item"><span class="legend-dot" style="background:#ffffff;border:1px dashed #3b82f6"></span>可选依赖箭头</span>
  </div>
</div>
</body>
</html>
