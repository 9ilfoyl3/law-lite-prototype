<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>01 · 文书生成主流程图（V1.1）</title>
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    --text: #1f2937;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --surface: #ffffff;
    --surface-muted: #f9fafb;
    --brand: #6d5ce7;
    --warn: #d4a017;
    --danger: #e74c3c;
    --radius-card: 12px;
    --spacer-8: 8px;
    --spacer-12: 12px;
    --spacer-16: 16px;
    --spacer-20: 20px;
  }
  body {
    margin: 0;
    padding: 24px;
    background: #f3f4f6;
    font-family: var(--font-sans);
    color: var(--text);
  }
  .widget-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: var(--spacer-20);
    max-width: 1040px;
    margin: 0 auto;
  }
  .widget-title { font-size: 18px; font-weight: 600; margin: 0 0 var(--spacer-8); }
  .widget-sub { font-size: 13px; color: var(--text-muted); margin: 0 0 var(--spacer-16); }
  .svg-wrap { width: 100%; }
  .legend {
    display: flex; gap: var(--spacer-16);
    margin-top: var(--spacer-12);
    font-size: 12px; color: var(--text-muted);
    flex-wrap: wrap;
  }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>
<div class="widget-card">
  <div class="widget-title">文书生成主流程图（V1.1）</div>
  <div class="widget-sub">从案件上传到文书产出的核心闭环：前端不做 Token 估算，超限由 workflow 返回异常后展示提示</div>
  <div class="svg-wrap">
    <svg viewBox="0 0 880 820" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrowFlow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#6b7280" />
        </marker>
        <marker id="arrowBrand" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#6d5ce7" />
        </marker>
        <marker id="arrowWarn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
          <path d="M1 1 L7 4 L1 7 Z" fill="#d4a017" />
        </marker>
      </defs>

      <!-- 1. 上传案件 -->
      <g>
        <rect x="350" y="20" width="180" height="48" rx="24" fill="#6d5ce7" stroke="#6d5ce7"/>
        <text x="440" y="49" text-anchor="middle" fill="#ffffff" font-size="14">上传案件材料</text>
      </g>
      <path d="M 440 70 L 440 96" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrowFlow)"/>

      <!-- 2. 文件解析（含异常分支） -->
      <g>
        <rect x="330" y="100" width="220" height="64" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
        <text x="440" y="126" text-anchor="middle" fill="#1f2937" font-size="14">文件解析</text>
        <text x="440" y="146" text-anchor="middle" fill="#6b7280" font-size="12">解析中 → 解析完成 / 解析异常</text>
        <text x="440" y="160" text-anchor="middle" fill="#6b7280" font-size="11">详情页仅展示 parseStatus=success</text>
      </g>

      <!-- 解析异常分支 -->
      <path d="M 550 132 L 660 132 L 660 180" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowWarn)"/>
      <rect x="600" y="112" width="40" height="20" rx="10" fill="#ffffff" stroke="#d4a017"/>
      <text x="620" y="126" text-anchor="middle" fill="#d4a017" font-size="11">异常</text>
      <g>
        <rect x="600" y="184" width="180" height="60" rx="8" fill="#fdf6e3" stroke="#d4a017" stroke-width="1.5"/>
        <text x="690" y="208" text-anchor="middle" fill="#1f2937" font-size="12">异常处理（列表页弹窗）</text>
        <text x="690" y="226" text-anchor="middle" fill="#6b7280" font-size="11">重新解析 / 重新上传 / 删除</text>
        <text x="690" y="240" text-anchor="middle" fill="#6b7280" font-size="11">部分异常不阻塞已成功部分</text>
      </g>
      <path d="M 690 244 L 690 270 L 440 270" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3" fill="none"/>

      <path d="M 440 166 L 440 196" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrowFlow)"/>

      <!-- 3. 案件列表页 -->
      <g>
        <rect x="320" y="200" width="240" height="60" rx="8" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
        <text x="440" y="226" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="500">案件列表页 cases.html</text>
        <text x="440" y="244" text-anchor="middle" fill="#6b7280" font-size="11">材料数量列 + 文书数徽章 + 解析状态</text>
        <text x="440" y="256" text-anchor="middle" fill="#6b7280" font-size="11">按钮可用性：无材料/解析中置灰</text>
      </g>
      <path d="M 440 262 L 440 296" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrowFlow)"/>

      <!-- 4. 生成入口分支 -->
      <g>
        <path d="M 440 302 L 540 360 L 440 418 L 340 360 Z" fill="#f9fafb" stroke="#6d5ce7" stroke-width="2"/>
        <text x="440" y="350" text-anchor="middle" fill="#1f2937" font-size="13">生成入口</text>
        <text x="440" y="368" text-anchor="middle" fill="#1f2937" font-size="13">选择</text>
        <text x="440" y="386" text-anchor="middle" fill="#6b7280" font-size="11">列表页/详情页</text>
      </g>

      <!-- 左分支：列表页一步生成 -->
      <path d="M 340 360 L 180 360 L 180 440" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>
      <rect x="200" y="340" width="80" height="22" rx="11" fill="#ffffff" stroke="#6d5ce7"/>
      <text x="240" y="355" text-anchor="middle" fill="#6d5ce7" font-size="11">列表页</text>

      <!-- 右分支：详情页 -->
      <path d="M 540 360 L 700 360 L 700 440" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrowFlow)"/>
      <rect x="620" y="340" width="80" height="22" rx="11" fill="#ffffff" stroke="#e5e7eb"/>
      <text x="660" y="355" text-anchor="middle" fill="#6b7280" font-size="11">详情页</text>

      <!-- 列表页：弹框配置 + sessionStorage 预填 -->
      <g>
        <rect x="80" y="444" width="200" height="76" rx="8" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
        <text x="180" y="468" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500">弹框配置文书类型/模板/提示词</text>
        <text x="180" y="486" text-anchor="middle" fill="#6b7280" font-size="11">模型字段只读展示</text>
        <text x="180" y="502" text-anchor="middle" fill="#6b7280" font-size="11">sessionStorage 传递至详情页</text>
        <text x="180" y="516" text-anchor="middle" fill="#6b7280" font-size="11">自动预填 + 自动勾选全部材料</text>
      </g>
      <path d="M 180 522 L 180 552" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrowFlow)"/>

      <!-- 详情页：Tab 选择 -->
      <g>
        <rect x="600" y="444" width="200" height="76" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
        <text x="700" y="468" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500">详情页 Tab 选择</text>
        <text x="700" y="486" text-anchor="middle" fill="#6b7280" font-size="11">一步生成 Tab（全类型）</text>
        <text x="700" y="502" text-anchor="middle" fill="#6b7280" font-size="11">分步生成 Tab（仅裁判文书）</text>
        <text x="700" y="516" text-anchor="middle" fill="#6b7280" font-size="11">Tab 切换时材料清空确认</text>
      </g>
      <path d="M 700 522 L 700 552" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrowFlow)"/>

      <!-- 5. 调用 workflow（前端不做 Token 估算） -->
      <g>
        <rect x="320" y="556" width="240" height="64" rx="8" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
        <text x="440" y="582" text-anchor="middle" fill="#1f2937" font-size="14" font-weight="500">调用 Workflow（端到端 API）</text>
        <text x="440" y="600" text-anchor="middle" fill="#6b7280" font-size="11">前端直接调用，不做前置 Token 估算</text>
        <text x="440" y="614" text-anchor="middle" fill="#6b7280" font-size="11">workflow 内部判断材料量</text>
      </g>
      <path d="M 180 556 L 180 588 L 320 588" stroke="#6b7280" stroke-width="1.5" fill="none"/>
      <path d="M 700 556 L 700 588 L 560 588" stroke="#6b7280" stroke-width="1.5" fill="none"/>

      <!-- workflow 异常分支 -->
      <path d="M 560 588 L 800 588 L 800 640" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowWarn)"/>
      <rect x="740" y="568" width="60" height="20" rx="10" fill="#ffffff" stroke="#d4a017"/>
      <text x="770" y="582" text-anchor="middle" fill="#d4a017" font-size="11">超限</text>
      <g>
        <rect x="700" y="644" width="180" height="92" rx="8" fill="#fdf6e3" stroke="#d4a017" stroke-width="1.5"/>
        <text x="790" y="664" text-anchor="middle" fill="#1f2937" font-size="12">workflow 返回超限异常</text>
        <text x="790" y="680" text-anchor="middle" fill="#6b7280" font-size="11">非裁判文书：材料量过大</text>
        <text x="790" y="694" text-anchor="middle" fill="#6b7280" font-size="11">裁判文书：可切换分步生成</text>
        <text x="790" y="708" text-anchor="middle" fill="#6b7280" font-size="11">补充字数参考 + 筛选入口</text>
        <text x="790" y="722" text-anchor="middle" fill="#d4a017" font-size="10">弹框 UI 统一 · overlay/dialog</text>
      </g>
      <!-- case7 演示标注 -->
      <g>
        <rect x="700" y="744" width="180" height="64" rx="8" fill="#f0edff" stroke="#6d5ce7" stroke-width="1.5" stroke-dasharray="4,3"/>
        <text x="790" y="764" text-anchor="middle" fill="#6d5ce7" font-size="11" font-weight="500">case7 演示场景</text>
        <text x="790" y="780" text-anchor="middle" fill="#6b7280" font-size="10">某建筑公司诉某房地产公司</text>
        <text x="790" y="792" text-anchor="middle" fill="#6b7280" font-size="10">36 材料 × 6000 ≈ 21.6 万字</text>
        <text x="790" y="804" text-anchor="middle" fill="#d4a017" font-size="10">&gt; 8 万阈值 → 触发超限分支</text>
      </g>

      <path d="M 440 622 L 440 660" stroke="#6d5ce7" stroke-width="2" fill="none" marker-end="url(#arrowBrand)"/>

      <!-- 6. 流式输出 -->
      <g>
        <rect x="320" y="664" width="240" height="56" rx="8" fill="#ffffff" stroke="#6d5ce7" stroke-width="2"/>
        <text x="440" y="688" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500">流式输出文书内容</text>
        <text x="440" y="706" text-anchor="middle" fill="#6b7280" font-size="11">专用渲染区 + 字数/进度提示</text>
        <text x="440" y="716" text-anchor="middle" fill="#6b7280" font-size="11">输出过程不可取消</text>
      </g>
      <path d="M 440 722 L 440 750" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrowFlow)"/>

      <!-- 7. 保存为文书版本 -->
      <g>
        <rect x="320" y="754" width="240" height="56" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
        <text x="440" y="778" text-anchor="middle" fill="#1f2937" font-size="13" font-weight="500">保存为文书版本</text>
        <text x="440" y="796" text-anchor="middle" fill="#6b7280" font-size="11">按 docType 合并 + 不覆盖已有版本</text>
      </g>
    </svg>
  </div>
  <div class="legend">
    <span class="legend-item"><span class="legend-dot" style="background:#6d5ce7"></span>主路径 / 焦点</span>
    <span class="legend-item"><span class="legend-dot" style="background:#ffffff;border:1px solid #e5e7eb"></span>普通节点</span>
    <span class="legend-item"><span class="legend-dot" style="background:#fdf6e3;border:1px solid #d4a017"></span>异常 / 警告</span>
  </div>
</div>
</body>
</html>
